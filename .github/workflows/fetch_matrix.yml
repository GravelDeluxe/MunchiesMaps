name: "Fetch Overpass Data (Matrix by Country)"

on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Optional comma-separated country ids, e.g. gb,pl,tr"
        required: false
        default: ""
        type: string
      layers:
        description: "Optional comma-separated layers, e.g. fast_food,fuel"
        required: false
        default: ""
        type: string
      regions:
        description: "Optional comma-separated region ids/slugs, e.g. england,wales"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Run without writing GeoJSON/manifest and without PR creation"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fetch-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    name: Prepare country matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      has_countries: ${{ steps.build.outputs.has_countries }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build country matrix from config + optional filter
        id: build
        env:
          INPUT_COUNTRIES: ${{ github.event.inputs.countries || '' }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import yaml

          def parse_csv(value: str) -> list[str]:
              return [item.strip().lower() for item in value.split(',') if item.strip()]

          def normalize_requested(requested: list[str], configured: list[str]) -> list[str]:
              configured_set = set(configured)
              alias_map = {
                  'de': 'germany',
                  'deutschland': 'germany',
                  'albania': 'al',
                  'greece': 'gr',
                  'montenegro': 'me',
                  'turkey': 'tr',
              }
              normalized: list[str] = []
              for country in requested:
                  target = alias_map.get(country, country)
                  if target in configured_set:
                      normalized.append(target)
                  else:
                      normalized.append(country)
              return normalized

          with open('fetch_data/config.yml', 'r', encoding='utf-8') as fh:
              config = yaml.safe_load(fh) or {}

          configured = []
          countries_cfg = config.get('countries', {})
          if isinstance(countries_cfg, dict):
              configured = sorted(str(key).strip().lower() for key in countries_cfg.keys() if str(key).strip())

          requested_raw = parse_csv(os.environ.get('INPUT_COUNTRIES', ''))
          requested = normalize_requested(requested_raw, configured)
          if requested:
              unknown = sorted(set(requested) - set(configured))
              if unknown:
                  raise SystemExit(
                      'Unknown country id(s): '
                      + ', '.join(unknown)
                      + '. Valid country ids are: '
                      + ', '.join(configured)
                  )
              requested_set = set(requested)
              selected = [country for country in configured if country in requested_set]
          else:
              selected = configured

          matrix = {'include': [{'country': country} for country in selected]}
          has_countries = 'true' if selected else 'false'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              out.write(f"has_countries={has_countries}\n")

          print(f"Configured countries: {configured}")
          print(f"Requested countries: {requested_raw or '<all>'}")
          print(f"Normalized countries: {requested or '<all>'}")
          print(f"Selected countries: {selected or '<none>'}")
          PY

  fetch-by-country:
    name: Fetch (${{ matrix.country }})
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.has_countries == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fetch_data/requirements.txt

      - name: Smoke test scripts
        run: |
          python -m py_compile \
            scripts/check_missing_json.py \
            fetch_data/fetch_overpass.py \
            fetch_data/fetch_missing_overpass.py

      - name: Run filtered fetch for matrix country
        id: run_fetch
        env:
          INPUT_LAYERS: ${{ github.event.inputs.layers || '' }}
          INPUT_REGIONS: ${{ github.event.inputs.regions || '' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set +e

          mkdir -p artifacts/fetch-failures
          failure_file="artifacts/fetch-failures/fetch-failures-${{ matrix.country }}.jsonl"
          : > "${failure_file}"
          cmd=(python fetch_data/fetch_overpass.py --countries "${{ matrix.country }}" --failure-log-jsonl "${failure_file}")

          if [ -n "${INPUT_LAYERS}" ]; then
            cmd+=(--layers "${INPUT_LAYERS}")
          fi

          if [ -n "${INPUT_REGIONS}" ]; then
            cmd+=(--regions "${INPUT_REGIONS}")
          fi

          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            cmd+=(--dry-run)
          fi

          printf -v cmd_pretty '%q ' "${cmd[@]}"
          echo "Running command: ${cmd_pretty% }"
          "${cmd[@]}"
          exit_code=$?

          cp -f artifacts/fetch_failures.json "artifacts/fetch_failures_${{ matrix.country }}.json" 2>/dev/null || true
          cp -f artifacts/fetch_failures.csv "artifacts/fetch_failures_${{ matrix.country }}.csv" 2>/dev/null || true
          cp -f artifacts/fetch_results.json "artifacts/fetch_results_${{ matrix.country }}.json" 2>/dev/null || true
          cp -f artifacts/fetch_summary.md "artifacts/fetch_summary_${{ matrix.country }}.md" 2>/dev/null || true

          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Append compact job summary
        if: always()
        run: |
          {
            echo "## Matrix result for ${{ matrix.country }}"
            if [ -f "artifacts/fetch_summary_${{ matrix.country }}.md" ]; then
              cat "artifacts/fetch_summary_${{ matrix.country }}.md"
            else
              echo "- No summary artifact produced by script."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fetch artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-artifacts-${{ matrix.country }}
          if-no-files-found: warn
          path: |
            artifacts/fetch_failures_${{ matrix.country }}.json
            artifacts/fetch_failures_${{ matrix.country }}.csv
            artifacts/fetch_results_${{ matrix.country }}.json
            artifacts/fetch_summary_${{ matrix.country }}.md
            artifacts/fetch-failures/fetch-failures-${{ matrix.country }}.jsonl

      - name: Prepare GeoJSON artifact for matrix country
        if: steps.run_fetch.outputs.exit_code == '0' && github.event.inputs.dry_run != 'true'
        id: geojson_artifact
        run: |
          set -euo pipefail
          git add resources/geojson
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          artifact_dir="artifacts/geojson-${{ matrix.country }}/resources/geojson"
          mkdir -p "${artifact_dir}"
          cp -R resources/geojson/. "${artifact_dir}/"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload GeoJSON changes artifact
        if: steps.geojson_artifact.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: geojson-changes-${{ matrix.country }}
          if-no-files-found: error
          path: artifacts/geojson-${{ matrix.country }}/

  retry_failed_fetches:
    name: Retry failed fetches
    needs: [prepare-matrix, fetch-by-country]
    if: always() && needs.prepare-matrix.outputs.has_countries == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fetch_data/requirements.txt

      - name: Download failure artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fetch-artifacts-*
          merge-multiple: true
          path: artifacts/fetch-failures

      - name: Run recovery fetch
        id: retry
        run: |
          set +e
          python scripts/retry_failed_fetches.py --failures-dir artifacts/fetch-failures --max-workers 1
          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload post-retry failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-failures-after-retry
          if-no-files-found: warn
          path: artifacts/fetch-failures-after-retry.jsonl

      - name: Append recovery summary
        if: always()
        run: |
          {
            echo "## Recovery Fetch Summary"
            if [ ! -s artifacts/fetch-failures-after-retry.jsonl ]; then
              echo "No failed fetch tasks to retry or all retries succeeded."
            else
              python - <<'PY'
              import json
              from pathlib import Path
              path = Path('artifacts/fetch-failures-after-retry.jsonl')
              for line in path.read_text(encoding='utf-8').splitlines()[:50]:
                  if not line.strip():
                      continue
                  try:
                      row = json.loads(line)
                  except Exception:
                      continue
                  msg = str(row.get('error_message', '')).replace('\n', ' ')[:160]
                  print(f"- {row.get('country','')}/{row.get('region_key','')}:{row.get('category','')} | {row.get('error_type','')} | {msg}")
              PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when retry still has failures
        if: steps.retry.outputs.exit_code != '0'
        run: exit 1

  create-combined-pr:
    name: Create combined GeoJSON PR
    needs: [prepare-matrix, fetch-by-country, retry_failed_fetches]
    if: always() && needs.prepare-matrix.outputs.has_countries == 'true' && github.event.inputs.dry_run != 'true' && needs.retry_failed_fetches.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download GeoJSON change artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: geojson-changes-*
          merge-multiple: true
          path: combined-artifacts

      - name: Restore GeoJSON files from artifacts
        id: restore_geojson
        run: |
          set -euo pipefail
          if [ ! -d "combined-artifacts/resources/geojson" ]; then
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
            echo "No GeoJSON change artifacts found; skipping combined PR creation."
            exit 0
          fi

          cp -R combined-artifacts/resources/geojson/. resources/geojson/
          echo "has_artifacts=true" >> "$GITHUB_OUTPUT"

      - name: Detect combined GeoJSON changes
        if: steps.restore_geojson.outputs.has_artifacts == 'true'
        id: combined_changes
        run: |
          set -euo pipefail
          git add resources/geojson
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create combined pull request
        if: steps.combined_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update GeoJSON data from matrix fetch"
          title: "Update GeoJSON data from matrix fetch"
          body: |
            Automated GeoJSON update from matrix fetch jobs.

            - Countries input: `${{ github.event.inputs.countries || '' }}`
            - Layers input: `${{ github.event.inputs.layers || '' }}`
            - Regions input: `${{ github.event.inputs.regions || '' }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Matrix country jobs executed independently and their resulting GeoJSON updates were combined into this single pull request.
          branch: data/fetch-matrix-combined-${{ github.run_id }}-${{ github.run_attempt }}
          base: main
          add-paths: |
            resources/geojson
