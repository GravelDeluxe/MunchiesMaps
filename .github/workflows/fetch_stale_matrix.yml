name: Fetch Stale GeoJSON (Matrix)

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Optional country key from config.yml, e.g. germany. Empty = all countries"
        required: false
        type: string
      category:
        description: "Optional category key, e.g. fast_food. Empty = all categories"
        required: false
        type: string
      days:
        description: "Refresh files older than this number of days. Use -1 to refresh all files."
        required: true
        default: "30"
        type: string
      retry_attempts:
        description: "Retry attempts per target within each fetch run"
        required: true
        default: "3"
        type: string
      recovery_rounds:
        description: "Number of recovery rounds after the initial fetch"
        required: true
        default: "2"
        type: string
      max_targets:
        description: "Optional max targets for test runs"
        required: false
        type: string
      allow_full_refresh_all_countries:
        description: "Safety guard for days=-1 with empty country. Must be YES to allow global full refresh."
        required: false
        default: "NO"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_targets: ${{ steps.matrix.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r fetch_data/requirements.txt

      - name: Validate inputs
        env:
          DAYS: "${{ inputs.days }}"
          RETRY: "${{ inputs.retry_attempts }}"
          RECOVERY: "${{ inputs.recovery_rounds }}"
          COUNTRY: "${{ inputs.country }}"
          ALLOW_FULL: "${{ inputs.allow_full_refresh_all_countries }}"
        run: |
          python - <<'PY'
          import os

          def intv(k):
              return int(os.environ[k])

          d = intv("DAYS")
          r = intv("RETRY")
          rr = intv("RECOVERY")

          assert (d == -1 or d > 0), "days must be -1 or >0"
          assert r > 0, "retry_attempts must be >0"
          assert rr >= 0, "recovery_rounds must be >=0"
          if d == -1 and not os.environ.get("COUNTRY", "").strip() and os.environ.get("ALLOW_FULL", "NO").strip() != "YES":
              raise SystemExit("Full refresh for all countries is very large. Set allow_full_refresh_all_countries=YES or provide a country filter.")
          PY

      - name: Build stale matrix inputs
        env:
          DAYS: "${{ inputs.days }}"
          COUNTRY: "${{ inputs.country }}"
          CATEGORY: "${{ inputs.category }}"
          MAX_TARGETS: "${{ inputs.max_targets }}"
        run: |
          PREPARE_DIR="$RUNNER_TEMP/stale-prepare"
          mkdir -p "$PREPARE_DIR/stale-targets-by-country"
          args=(
            --config fetch_data/config.yml
            --days "$DAYS"
            --output "$PREPARE_DIR/stale_targets.json"
          )

          if [ -n "$COUNTRY" ]; then
            args+=(--country "$COUNTRY")
          fi

          if [ -n "$CATEGORY" ]; then
            args+=(--category "$CATEGORY")
          fi

          python scripts/check_stale_json.py "${args[@]}"

          if [ -n "$MAX_TARGETS" ]; then
            python - <<'PY'
          import json
          import os

          p = os.path.join(os.environ["RUNNER_TEMP"], "stale-prepare", "stale_targets.json")
          m = int(os.environ["MAX_TARGETS"])

          with open(p, "r", encoding="utf-8") as f:
              data = json.load(f)

          with open(p, "w", encoding="utf-8") as f:
              json.dump(data[:m], f, indent=2)
          PY
          fi

          python scripts/split_stale_targets.py \
            --input "$PREPARE_DIR/stale_targets.json" \
            --output-dir "$PREPARE_DIR/stale-targets-by-country" \
            --matrix-output "$PREPARE_DIR/stale_matrix.json" \
            --artifact-root "$PREPARE_DIR"

      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "stale-prepare", "stale_matrix.json"), "r", encoding="utf-8") as f:
              matrix = json.load(f)

          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          print("has_targets=" + ("true" if matrix.get("include") else "false"))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stale-prepare
          path: ${{ runner.temp }}/stale-prepare

  fetch:
    needs: prepare
    if: needs.prepare.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r fetch_data/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: stale-prepare
          path: ${{ runner.temp }}/stale-prepare

      - run: |
          TARGETS_FILE="$RUNNER_TEMP/stale-prepare/${{ matrix.targets_file }}"
          FETCHED_DIR="$RUNNER_TEMP/fetched/${{ matrix.country }}"
          FAILED_FILE="$RUNNER_TEMP/failed/${{ matrix.country }}.json"
          mkdir -p "$FETCHED_DIR" "$RUNNER_TEMP/failed"

          if [ ! -f "$TARGETS_FILE" ]; then
            echo "::error::Targets file not found: $TARGETS_FILE"
            echo "Matrix targets_file was: ${{ matrix.targets_file }}"
            find "$RUNNER_TEMP/stale-prepare" -maxdepth 4 -type f -print
            exit 1
          fi

          python fetch_data/fetch_stale_overpass.py --config fetch_data/config.yml --targets "$TARGETS_FILE" --retry-attempts "${{ inputs.retry_attempts }}" --retry-sleep 30 --output-dir "$FETCHED_DIR" --failed-output "$FAILED_FILE" --debug

      - uses: actions/upload-artifact@v4
        with:
          name: fetched-initial-${{ matrix.country }}
          path: ${{ runner.temp }}/fetched/${{ matrix.country }}

      - uses: actions/upload-artifact@v4
        with:
          name: failed-initial-${{ matrix.country }}
          path: ${{ runner.temp }}/failed/${{ matrix.country }}.json

  recovery:
    needs: [prepare, fetch]
    if: ${{ always() && needs.prepare.outputs.has_targets == 'true' && fromJson(inputs.recovery_rounds) > 0 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r fetch_data/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts-download

      - name: Recovery rounds (sequential)
        env:
          RECOVERY_ROUNDS: "${{ inputs.recovery_rounds }}"
          RETRY_ATTEMPTS: "${{ inputs.retry_attempts }}"
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-current"
          python - <<'PY'
          import glob
          import json
          import os

          items = []
          seen = set()
          for path in glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "artifacts-download", "failed-initial-*", "*.json")):
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              for item in data:
                  key = (item.get("country"), item.get("region"), item.get("category"), item.get("path"))
                  if key in seen:
                      continue
                  seen.add(key)
                  items.append(item)

          out = os.path.join(os.environ["RUNNER_TEMP"], "recovery-current", "targets.json")
          with open(out, "w", encoding="utf-8") as f:
              json.dump(items, f, indent=2)
          print(f"Recovery targets: {len(items)}")
          PY

          count=$(python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "recovery-current" / "targets.json"
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              print(f"Failed to parse recovery targets file: {path}", file=sys.stderr)
              print(path.read_text(encoding="utf-8")[:500], file=sys.stderr)
              raise
          print(len(data))
          PY
          )
          if [ "$count" = "0" ]; then
            echo "No failed initial targets found; skipping recovery rounds."
            exit 0
          fi

          for round in $(seq 1 "$RECOVERY_ROUNDS"); do
            python fetch_data/fetch_stale_overpass.py --config fetch_data/config.yml --targets "$RUNNER_TEMP/recovery-current/targets.json" --retry-attempts "$RETRY_ATTEMPTS" --retry-sleep 30 --output-dir "$RUNNER_TEMP/recovery-round-${round}/fetched" --failed-output "$RUNNER_TEMP/recovery-round-${round}/failed/failed.json"
            cp "$RUNNER_TEMP/recovery-round-${round}/failed/failed.json" "$RUNNER_TEMP/recovery-current/targets.json"
            count=$(python - <<'PY'
            import json
            import os
            import sys
            from pathlib import Path

            path = Path(os.environ["RUNNER_TEMP"]) / "recovery-current" / "targets.json"
            try:
                data = json.loads(path.read_text(encoding="utf-8"))
            except Exception:
                print(f"Failed to parse recovery targets file: {path}", file=sys.stderr)
                print(path.read_text(encoding="utf-8")[:500], file=sys.stderr)
                raise
            print(len(data))
            PY
            )
            if [ "$count" = "0" ]; then
              echo "No targets left after recovery round $round"
              break
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: recovery-artifacts
          path: ${{ runner.temp }}/recovery-round-*

  create-pr:
    needs: [prepare, fetch, recovery]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.has_targets == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts-download

      - id: changes
        name: Restore fetched GeoJSON files
        run: |
          find "$RUNNER_TEMP/artifacts-download" -maxdepth 5 -type f | sort | head -200

          found=0
          copied=0
          while IFS= read -r -d '' f; do
            found=$((found + 1))
            rel=${f#*resources/geojson/}
            mkdir -p "resources/geojson/$(dirname "$rel")"
            cp "$f" "resources/geojson/$rel"
            copied=$((copied + 1))
          done < <(find "$RUNNER_TEMP/artifacts-download" -type f -path '*/resources/geojson/*' -name '*.geojson' -print0)
          echo "Found fetched GeoJSON files: $found"
          echo "Copied GeoJSON files: $copied"
          {
            echo "### Stale fetch restore summary"
            echo "- Found fetched GeoJSON files: $found"
            echo "- Copied GeoJSON files: $copied"
          } >> "$GITHUB_STEP_SUMMARY"
          git status --short resources/geojson
          git add resources/geojson/**/*.geojson resources/geojson/manifest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo 'No GeoJSON changes; skipping PR'
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: peter-evans/create-pull-request@v6
        if: steps.changes.outputs.has_changes == 'true'
        with:
          branch: data/stale-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          title: Refresh stale GeoJSON data
          commit-message: Refresh stale GeoJSON data
          add-paths: |
            resources/geojson/**/*.geojson
            resources/geojson/manifest.json
          body: |
            Automated stale GeoJSON refresh.
            - days: `${{ inputs.days }}`
            - country filter: `${{ inputs.country || 'all' }}`
            - category filter: `${{ inputs.category || 'all' }}`
            - retry_attempts: `${{ inputs.retry_attempts }}`
            - recovery_rounds: `${{ inputs.recovery_rounds }}`
            Age calculation uses `git log -1 --format=%cI -- <path>`.
