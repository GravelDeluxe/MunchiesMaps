name: "Fetch Overpass Data"

on:
  workflow_dispatch:
  schedule:
   - cron: "0 1 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git and workflow permissions notice
        run: |
          git config --global core.quotepath false
          echo "To allow this workflow to create PRs, ensure the repo setting is enabled:"
          echo "Settings → Actions → General → Workflow permissions → Read and write"
          echo "and enable “Allow GitHub Actions to create and approve pull requests”."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fetch_data/requirements.txt

      - name: Run fetch script
        run: python fetch_data/fetch_overpass.py

      - name: Check for geojson changes
        id: geojson_changes
        run: |
          git add resources/geojson
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.geojson_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update GeoJSON data"
          title: "Update GeoJSON data"
          body: |
            This PR was generated by the GeoJSON update workflow.
            Please review and merge manually.
          branch: data/geojson-update
          base: main
          add-paths: resources/geojson
