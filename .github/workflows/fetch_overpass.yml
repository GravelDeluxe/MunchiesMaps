name: "Fetch Overpass Data"

on:
  workflow_dispatch:
  schedule:
   - cron: "0 1 1 * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fetch_data/requirements.txt

      - name: Run fetch script
        run: python fetch_data/fetch_overpass.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add resources/geojson
          git commit -m "Update Overpass GeoJSON resources" || echo "No changes to commit"
          git push
