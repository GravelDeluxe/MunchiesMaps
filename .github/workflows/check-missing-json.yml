name: "Check Missing GeoJSON Files"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-missing-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fetch_data/requirements.txt

      - name: Validate configured GeoJSON files
        run: python scripts/check_missing_json.py
