<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Testkarte – Clustering ab 10 + Layer Dropdown + Standort</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --border: rgba(0,0,0,0.12);
      --btn-bg: rgba(255,255,255,0.95);
      --btn-text: #0f172a;
      --btn-border: rgba(0,0,0,0.18);
      --btn-shadow: 0 2px 10px rgba(0,0,0,0.18);
      --overlay: rgba(0,0,0,0.35);
      --action-bg: rgba(245,245,245,0.92);
      --switch-bg: #e5e7eb;
      --switch-thumb: #ffffff;
      --control-bg: rgba(255,255,255,0.96);
      --control-bg-hover: rgba(245,245,245,0.96);
      --control-text: #0f172a;
      --control-border: rgba(0,0,0,0.18);
      --popup-bg: #ffffff;
      --popup-text: #111827;
      --popup-border: rgba(0,0,0,0.12);
    }

    .theme-dark {
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #cbd5e1;
      --border: rgba(255,255,255,0.14);
      --btn-bg: rgba(30,41,59,0.92);
      --btn-text: #e5e7eb;
      --btn-border: rgba(255,255,255,0.18);
      --btn-shadow: 0 2px 12px rgba(0,0,0,0.45);
      --overlay: rgba(0,0,0,0.55);
      --action-bg: rgba(45,55,72,0.85);
      --switch-bg: #1e293b;
      --switch-thumb: #0ea5e9;
      --control-bg: rgba(30,41,59,0.95);
      --control-bg-hover: rgba(46,58,76,0.95);
      --control-text: #e5e7eb;
      --control-border: rgba(255,255,255,0.2);
      --popup-bg: #0f172a;
      --popup-text: #e5e7eb;
      --popup-border: rgba(255,255,255,0.18);
    }

    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    #map { height: 100%; width: 100%; }

    /* Drawer + overlay */
    .map-controls-br {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 1035;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #layerDrawerToggle,
    #locateButton {
      padding: 10px 14px;
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      background: var(--btn-bg);
      box-shadow: var(--btn-shadow);
      color: var(--btn-text);
      font: 14px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-weight: 700;
      cursor: pointer;
    }
    #layerDrawerToggle:active,
    #locateButton:active { transform: translateY(1px); }

    #layerDrawerBackdrop {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 1040;
    }
    #layerDrawerBackdrop.open { opacity: 1; pointer-events: all; }

    #layerDrawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: auto;
      max-width: min(92vw, 420px);
      min-width: 260px;
      background: var(--panel);
      box-shadow: -2px 0 16px rgba(0,0,0,0.2);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 1055;
      display: flex;
      flex-direction: column;
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
    }
    #layerDrawer.open { transform: translateX(0); }
    #layerDrawer header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    #layerDrawer header h2 { margin: 0; font-size: 18px; }
    #layerDrawer header button {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 6px;
      color: var(--text);
    }
    #layerDrawer .drawer-body { flex: 1; overflow: auto; padding: 0 16px 18px; }
    #layerDrawer .section { border-bottom: 1px solid var(--border); }
    #layerDrawer .section:last-of-type { border-bottom: none; }
    .accordion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      cursor: pointer;
      font-weight: 700;
      gap: 12px;
      color: var(--text);
    }
    .accordion-header span { flex: 1; }
    .accordion-header .chevron {
      transition: transform 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-size: 16px;
    }
    .accordion-header[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
    .accordion-body { padding: 0 0 14px; display: none; color: var(--text); }
    .accordion-body.open { display: block; }
    .action-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .action-row button {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--btn-border);
      background: var(--action-bg);
      cursor: pointer;
      font-weight: 650;
      color: var(--text);
    }
    .checklist { display: flex; flex-direction: column; gap: 8px; }
    .checklist .checkrow { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); }
    .checklist input[type="checkbox"] { width: 16px; height: 16px; }
    .cat-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex: 0 0 10px;
      border: 1px solid var(--border);
      box-sizing: border-box;
    }
    /* Custom controls */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      box-shadow: 0 1px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      user-select: none;
      font: 13px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--btn-text);
    }
    .btn:active { transform: translateY(1px); }

    /* Drawer bottom */
    .drawer-bottom {
      border-top: 1px solid var(--border);
      padding: 12px 16px 16px;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      color: var(--text);
      user-select: none;
    }
    .theme-toggle input { display: none; }
    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
      border-radius: 999px;
      background: var(--switch-bg);
      border: 1px solid var(--border);
      transition: background 0.2s ease;
      flex-shrink: 0;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--switch-thumb);
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      transition: transform 0.2s ease;
    }
    .theme-toggle input:checked + .toggle-switch::after { transform: translateX(22px); }

    .gpx-inputs { display: flex; flex-direction: column; gap: 10px; }
    .gpx-row { display: flex; flex-direction: column; gap: 6px; }
    .gpx-row label { font-weight: 650; color: var(--text); }
    .gpx-row input[type="number"] { width: 120px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
    .gpx-row input[type="file"] { color: var(--text); }
    .gpx-apply { align-self: flex-start; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--btn-border); background: var(--action-bg); cursor: pointer; font-weight: 700; color: var(--text); }
    .gpx-error { color: #dc2626; font-size: 13px; }

    .drawer-reset-btn { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--btn-border); background: var(--action-bg); cursor: pointer; font-weight: 750; color: var(--text); }

    /* Cluster icon */
    .cluster-badge {
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 750;
      border: 1px solid rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.92);
      box-shadow: 0 1px 6px rgba(0,0,0,0.15);
      min-width: 34px;
      text-align: center;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .cluster-badge svg { width: 14px; height: 14px; display:block; }

    /* Map controls */
    .leaflet-bar a,
    .leaflet-bar a:link,
    .leaflet-bar a:visited {
      background: var(--control-bg);
      color: var(--control-text);
      border-bottom: 1px solid var(--control-border);
      box-shadow: none;
    }
    .leaflet-bar a:last-child { border-bottom: none; }
    .leaflet-bar a:hover { background: var(--control-bg-hover); color: var(--control-text); }
    .leaflet-bar,
    .leaflet-control-zoom {
      border: 1px solid var(--control-border);
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
      border-radius: 10px;
      overflow: hidden;
    }
    .leaflet-touch .leaflet-bar a { color: var(--control-text); }

    /* Popups */
    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: var(--popup-bg);
      color: var(--popup-text);
      border: 1px solid var(--popup-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .leaflet-popup-content { color: var(--popup-text); }
    .leaflet-popup-close-button { color: var(--popup-text); }
    .leaflet-popup-content a { color: var(--btn-text); }

    .popup-content { font: 13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 320px; color: var(--popup-text); }
    .popup-title { font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .popup-cat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--popup-border); background: rgba(0,0,0,0.03); }
    .popup-cat .cat-dot { border-color: var(--popup-border); }
    .theme-dark .popup-cat { background: rgba(255,255,255,0.06); }
    .popup-desc { margin-bottom: 8px; }
    .popup-extra { border-top: 1px solid var(--popup-border); padding-top: 8px; }
  </style>
  <script>
    (function() {
      const storedTheme = localStorage.getItem('theme');
      const isDark = storedTheme === 'dark';
      document.documentElement.classList.toggle('theme-dark', isDark);
      document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      window.__themePreference = isDark ? 'dark' : 'light';
      window.__isDarkTheme = isDark;
    })();
  </script>
</head>
<body>
    <div id="map"></div>
    <div class="map-controls-br">
      <button id="locateButton" type="button" aria-label="Standort zentrieren">Standort</button>
      <button id="layerDrawerToggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Filter öffnen">Filter</button>
    </div>
    <div id="layerDrawerBackdrop" aria-hidden="true"></div>
  <aside id="layerDrawer" aria-hidden="true" aria-label="Filter">
    <header>
      <h2>Filter</h2>
      <button type="button" id="layerDrawerClose" aria-label="Schließen">×</button>
    </header>
    <div class="drawer-body">
      <div class="section" id="bundeslandSection">
        <div class="accordion-header" data-target="blSection" aria-expanded="false" role="button" tabindex="0">
          <span>Bundesland</span>
          <span class="chevron">⌄</span>
        </div>
        <div class="accordion-body" id="blSection">
          <div class="action-row">
            <button type="button" id="blSelectAll">Alle auswählen</button>
            <button type="button" id="blSelectNone">Keine auswählen</button>
          </div>
          <div class="checklist" id="blList"></div>
        </div>
      </div>
      <div class="section" id="kategorieSection">
        <div class="accordion-header" data-target="catSection" aria-expanded="false" role="button" tabindex="0">
          <span>Kategorie</span>
          <span class="chevron">⌄</span>
        </div>
        <div class="accordion-body" id="catSection">
          <div class="action-row">
            <button type="button" id="catSelectAll">Alle auswählen</button>
            <button type="button" id="catSelectNone">Keine auswählen</button>
          </div>
          <div class="checklist" id="catList"></div>
        </div>
      </div>
      <div class="section" id="gpxSection">
        <div class="accordion-header" data-target="gpxBody" aria-expanded="false" role="button" tabindex="0">
          <span>GPX-Import</span>
          <span class="chevron">⌄</span>
        </div>
        <div class="accordion-body" id="gpxBody">
          <div class="gpx-inputs">
            <div class="gpx-row">
              <label for="gpxFileInput">GPX-Datei</label>
              <input type="file" id="gpxFileInput" accept=".gpx" />
            </div>
            <div class="gpx-row">
              <label for="gpxRadiusKm">Umkreis (km)</label>
              <input type="number" id="gpxRadiusKm" min="0" step="1" value="5" />
            </div>
            <button type="button" class="gpx-apply" id="gpxApplyBtn">Anwenden</button>
            <div class="gpx-error" id="gpxError" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="drawer-bottom">
      <button type="button" id="resetAllBtn" class="drawer-reset-btn">Zurücksetzen</button>
      <label class="theme-toggle" for="darkModeToggle">
        <span>Darkmode</span>
        <input type="checkbox" id="darkModeToggle" aria-label="Darkmode umschalten" />
        <span class="toggle-switch" aria-hidden="true"></span>
      </label>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/supercluster@8.0.1/dist/supercluster.min.js"></script>

  <script>
    const THEME_KEY = 'theme';

    const CATEGORY_STYLE = {
      fuel: { color: '#f97316' },
      supermarkets: { color: '#22c55e' },
      drinking_water: { color: '#0ea5e9' },
      burger_king: { color: '#a855f7' },
      mcdonalds: { color: '#ef4444' },
      toilets_public: { color: '#06b6d4' },
      vending_snacks: { color: '#eab308' }
    };

    function categoryColor(categoryId) {
      return CATEGORY_STYLE[categoryId]?.color || '#6b7280';
    }

    let categoryLabelMap = {};

    let baseLayers = null;
    let activeBaseLayer = null;

    function applyTheme(isDark) {
      const nextIsDark = isDark === true;
      const next = nextIsDark ? 'dark' : 'light';
      document.documentElement.classList.toggle('theme-dark', nextIsDark);
      document.documentElement.dataset.theme = next;
      updateMapTheme(next);
    }

    function updateMapTheme(theme) {
      if (!window.map || !baseLayers) return;
      const target = theme === 'dark' ? 'dark' : 'light';
      const nextLayer = baseLayers[target];
      if (!nextLayer) return;

      if (activeBaseLayer && activeBaseLayer !== nextLayer) {
        map.removeLayer(activeBaseLayer);
      }

      if (!map.hasLayer(nextLayer)) {
        nextLayer.addTo(map);
      }
      if (typeof nextLayer.bringToBack === 'function') {
        nextLayer.bringToBack();
      }
      activeBaseLayer = nextLayer;
    }

    function setupThemeToggle() {
      const toggle = document.getElementById('darkModeToggle');
      if (!toggle) return;
      const initial = window.__isDarkTheme === true;
      toggle.checked = initial;

      toggle.addEventListener('change', () => {
        const isDark = toggle.checked;
        applyTheme(isDark);
        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      });
    }

    const map = L.map('map', { zoomControl: true, preferCanvas: true });
    window.map = map;

    const FALLBACK_VIEW = { center: [52.52, 13.405], zoom: 11 };
    // Ensure the map has an initial view before any custom layers render.
    map.setView(FALLBACK_VIEW.center, FALLBACK_VIEW.zoom);

    const LIGHT_TILES = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap-Mitwirkende'
    });
    const DARK_TILES = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap-Mitwirkende, &copy; <a href="https://carto.com/attributions">CARTO</a>'
    });

    baseLayers = { light: LIGHT_TILES, dark: DARK_TILES };

    const initialTheme = window.__isDarkTheme === true;
    applyTheme(initialTheme);

    const MANIFEST_URL = 'resources/geojson/manifest.json';

    const filterState = {
      bundeslaender: new Set(),
      kategorien: new Set()
    };

    const DEFAULT_GPX_RADIUS_KM = 5;
    const gpxState = {
      points: [],
      sampledPoints: [],
      radiusMeters: DEFAULT_GPX_RADIUS_KM * 1000,
      bbox: null,
      active: false
    };

    const comboRegistry = new Map();
    const missingWarnings = new Set();
    let manifestData = { bundeslaender: [], categories: [] };

    function comboKey(bundeslandId, categoryId) {
      return `${bundeslandId}__${categoryId}`;
    }

    function renderChecklist(containerId, items, selectedSet, setName) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      items.forEach((item, idx) => {
        const row = document.createElement('label');
        row.classList.add('checkrow');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = item.id;
        cb.checked = selectedSet.has(item.id);
        cb.id = `${setName}-${idx}`;
        cb.addEventListener('change', (e) => {
          if (e.target.checked) {
            selectedSet.add(item.id);
          } else {
            selectedSet.delete(item.id);
          }
          triggerApplyFilters();
        });
        let dot = null;
        if (setName === 'cat') {
          dot = document.createElement('span');
          dot.className = 'cat-dot';
          dot.dataset.catId = item.id;
          dot.style.backgroundColor = categoryColor(item.id);
        }
        const text = document.createElement('span');
        text.textContent = item.label;
        row.appendChild(cb);
        if (dot) { row.appendChild(dot); }
        row.appendChild(text);
        container.appendChild(row);
      });
    }

    function selectAll(items, set, containerId, setName) {
      items.forEach(v => set.add(v.id));
      renderChecklist(containerId, items, set, setName);
      triggerApplyFilters();
    }

    function selectNone(set, containerId, setName, items) {
      set.clear();
      renderChecklist(containerId, items, set, setName);
      triggerApplyFilters();
    }

    function clampRadiusKm(value) {
      const km = Math.max(0, Math.floor(Number(value)) || 0);
      return km;
    }

    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('Datei konnte nicht gelesen werden'));
        reader.readAsText(file);
      });
    }

    function parseGpxText(text) {
      try {
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, 'application/xml');
        const pts = Array.from(xml.querySelectorAll('trkpt, rtept'))
          .map((el) => {
            const lat = parseFloat(el.getAttribute('lat'));
            const lon = parseFloat(el.getAttribute('lon'));
            if (Number.isFinite(lat) && Number.isFinite(lon)) {
              return { lat, lon };
            }
            return null;
          })
          .filter(Boolean);
        return pts;
      } catch (err) {
        console.error('GPX parse error', err);
        return [];
      }
    }

    function downsamplePoints(points, maxPoints = 2000) {
      if (!Array.isArray(points) || !points.length) return [];
      const step = Math.max(1, Math.ceil(points.length / maxPoints));
      const sampled = points.filter((_, idx) => idx % step === 0);
      const last = points[points.length - 1];
      if (sampled[sampled.length - 1] !== last) {
        sampled.push(last);
      }
      return sampled;
    }

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function computeExpandedBBox(points, radiusMeters) {
      if (!points.length) return null;
      let minLat = points[0].lat, maxLat = points[0].lat, minLon = points[0].lon, maxLon = points[0].lon;
      points.forEach(({ lat, lon }) => {
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
      });
      const latBuffer = radiusMeters / 111320;
      const avgLatRad = ((minLat + maxLat) / 2) * (Math.PI / 180);
      const lonBuffer = radiusMeters / (111320 * Math.max(Math.cos(avgLatRad), 0.0001));
      return {
        minLat: minLat - latBuffer,
        maxLat: maxLat + latBuffer,
        minLon: minLon - lonBuffer,
        maxLon: maxLon + lonBuffer
      };
    }

    function isPointInBBox(lat, lon, bbox) {
      if (!bbox) return true;
      return !(lat < bbox.minLat || lat > bbox.maxLat || lon < bbox.minLon || lon > bbox.maxLon);
    }

    function isFeatureNearGpx(feature) {
      if (!gpxState.active || !gpxState.sampledPoints.length) return true;
      if (!feature || !feature.geometry || feature.geometry.type !== 'Point') return false;
      const coords = feature.geometry.coordinates || [];
      const lon = Number(coords[0]);
      const lat = Number(coords[1]);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return false;
      if (!isPointInBBox(lat, lon, gpxState.bbox)) return false;

      const radius = gpxState.radiusMeters;
      let minDist = Infinity;
      for (let i = 0; i < gpxState.sampledPoints.length; i++) {
        const pt = gpxState.sampledPoints[i];
        const dist = haversineMeters(lat, lon, pt.lat, pt.lon);
        if (dist < minDist) minDist = dist;
        if (minDist <= radius) break;
      }
      return minDist <= radius;
    }

    function filteredFeatures(entry) {
      if (!entry || !Array.isArray(entry.originalFeatures)) return [];
      if (!gpxState.active || !gpxState.sampledPoints.length) return entry.originalFeatures;
      return entry.originalFeatures.filter((f) => isFeatureNearGpx(f));
    }

    function triggerApplyFilters() {
      applyFilters().catch(err => console.error(err));
    }

    function measureDrawerWidth() {
      const drawer = document.getElementById('layerDrawer');
      if (!drawer) return;
      const headers = drawer.querySelectorAll('.accordion-header');
      if (!headers.length) return;

      // Allow natural sizing to measure intrinsic widths
      drawer.style.width = 'auto';

      let maxHeaderWidth = 0;
      headers.forEach((header) => {
        maxHeaderWidth = Math.max(maxHeaderWidth, header.scrollWidth);
      });

      const BUFFER = 24;
      const MIN_WIDTH = 260;
      const MAX_WIDTH = Math.min(window.innerWidth * 0.92, 420);
      const targetWidth = Math.min(Math.max(maxHeaderWidth + BUFFER, MIN_WIDTH), MAX_WIDTH);

      drawer.style.width = `${targetWidth}px`;
    }

    function setupDrawerWidthMeasurement() {
      const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      // Measure once immediately and again after fonts settle to avoid jumps
      measureDrawerWidth();
      fontsReady.then(measureDrawerWidth).catch(() => measureDrawerWidth());

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(measureDrawerWidth, 150);
      });
    }

    function setAccordionHandlers() {
      document.querySelectorAll('.accordion-header').forEach(header => {
        const targetId = header.getAttribute('data-target');
        const body = document.getElementById(targetId);
        const toggle = () => {
          const next = !body.classList.contains('open');
          body.classList.toggle('open', next);
          header.setAttribute('aria-expanded', next ? 'true' : 'false');
        };
        header.addEventListener('click', toggle);
        header.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggle();
          }
        });
      });
    }

    function setupDrawer() {
      const drawer = document.getElementById('layerDrawer');
      const backdrop = document.getElementById('layerDrawerBackdrop');
      const toggleBtn = document.getElementById('layerDrawerToggle');
      const closeBtn = document.getElementById('layerDrawerClose');

      const openDrawer = () => {
        drawer.classList.add('open');
        drawer.setAttribute('aria-hidden', 'false');
        backdrop.classList.add('open');
        backdrop.setAttribute('aria-hidden', 'false');
        toggleBtn.setAttribute('aria-expanded', 'true');
      };

      const closeDrawer = () => {
        drawer.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
        backdrop.classList.remove('open');
        backdrop.setAttribute('aria-hidden', 'true');
        toggleBtn.setAttribute('aria-expanded', 'false');
      };

      toggleBtn.addEventListener('click', () => {
        if (drawer.classList.contains('open')) {
          closeDrawer();
        } else {
          openDrawer();
        }
      });
      closeBtn.addEventListener('click', closeDrawer);
      backdrop.addEventListener('click', closeDrawer);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
      });
    }

    function popupHtml(props, categoryId) {
      const p = props || {};
      const name = p.name || '(ohne Name)';
      const desc = p.description ? p.description : '';
      const catLabel = categoryId ? categoryLabelMap[categoryId] : null;
      const catColor = categoryId ? categoryColor(categoryId) : null;
      const categoryBadge = catLabel ? `<span class="popup-cat"><span class="cat-dot" aria-hidden="true" style="background:${catColor};"></span><span>${catLabel}</span></span>` : '';
      const other = Object.keys(p)
        .filter(k => !['name','description','cluster','cluster_id','point_count','point_count_abbreviated'].includes(k))
        .filter(k => p[k] != null && String(p[k]).trim() !== '')
        .slice(0, 20)
        .map(k => `<div><b>${k}</b>: ${String(p[k])}</div>`)
        .join('');
      return `
        <div class="popup-content">
          <div class="popup-title">${categoryBadge ? categoryBadge : ''}<span>${name}</span></div>
          ${desc ? `<div class="popup-desc">${desc}</div>` : ''}
          ${other ? `<div class="popup-extra">${other}</div>` : ''}
        </div>
      `;
    }

    // Simple SVG icons (circle + glyph)
    function svgIcon(glyphSvgPathD, fillColor) {
      const circleFill = fillColor || 'white';
      const strokeColor = 'var(--control-border, rgba(0,0,0,0.18))';
      const glyphColor = 'var(--btn-text, #0f172a)';
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
          <circle cx="14" cy="14" r="12" fill="${circleFill}" stroke="${strokeColor}" stroke-width="1.5"/>
          <path d="${glyphSvgPathD}" fill="${glyphColor}"/>
        </svg>
      `.trim();
      return L.divIcon({
        className: '',
        html: svg,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14]
      });
    }

    const defaultPinPath = "M14 4a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z";
    // Water drop glyph (simple)
    const waterDropPath = "M14 6 C11 10,9 12,9 15 a5 5 0 0 0 10 0 c0-3-2-5-5-9 z";
    // Vending machine glyph (simplified rectangle + slots)
    const vendingPath = "M10 7 h8 a1 1 0 0 1 1 1 v12 a1 1 0 0 1-1 1 h-8 a1 1 0 0 1-1-1 v-12 a1 1 0 0 1 1-1 z M11.5 9.2 h5 v2.2 h-5 z M11.5 12.3 h5 v1.3 h-5 z M11.5 14.4 h5 v1.3 h-5 z M12 17.2 h4 v2 h-4 z";

    function clusterGlyph(glyphPathD, fillColor) {
      const circleFill = fillColor || 'white';
      const strokeColor = 'var(--control-border, rgba(0,0,0,0.18))';
      const glyphColor = 'var(--btn-text, #0f172a)';
      return `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" aria-hidden="true">
          <circle cx="14" cy="14" r="10" fill="${circleFill}" stroke="${strokeColor}" stroke-width="1.5"/>
          <path d="${glyphPathD}" fill="${glyphColor}"/>
        </svg>
      `.trim();
    }

    function glyphPathForCategory(categoryId) {
      if (categoryId === 'drinking_water') return waterDropPath;
      if (categoryId === 'vending_snacks') return vendingPath;
      return defaultPinPath;
    }

    const ICON_CACHE = {};
    const CLUSTER_GLYPH_CACHE = {};

    function iconForCategory(categoryId) {
      const key = categoryId || 'default';
      if (!ICON_CACHE[key]) {
        ICON_CACHE[key] = svgIcon(glyphPathForCategory(categoryId), categoryColor(categoryId));
      }
      return ICON_CACHE[key];
    }

    function clusterGlyphForCategory(categoryId) {
      const key = categoryId || 'default';
      if (!CLUSTER_GLYPH_CACHE[key]) {
        CLUSTER_GLYPH_CACHE[key] = clusterGlyph(glyphPathForCategory(categoryId), categoryColor(categoryId));
      }
      return CLUSTER_GLYPH_CACHE[key];
    }

    class SuperclusterLayer extends L.Layer {
      constructor(geojson, options) {
        super();
        this.options = options || {};
        this._index = new Supercluster({
          radius: this.options.radius ?? 60,
          maxZoom: this.options.maxZoom ?? 18,
          minPoints: this.options.minPoints ?? 10
        });
        this._points = [];
        this.updateDataFromFeatures(geojson.features || []);
        this._render = this._render.bind(this);
      }

      onAdd(map) {
        this._map = map;
        this._group = L.layerGroup().addTo(map);
        map.on('moveend zoomend', this._render);
        this._render();
      }

      onRemove(map) {
        map.off('moveend zoomend', this._render);
        map.removeLayer(this._group);
        this._group = null;
        this._map = null;
      }

      getBounds() {
        const coords = this._points.map(p => p.geometry.coordinates);
        if (!coords.length) return null;
        let minX=coords[0][0], minY=coords[0][1], maxX=coords[0][0], maxY=coords[0][1];
        for (const [x,y] of coords) {
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
        return L.latLngBounds([minY, minX], [maxY, maxX]);
      }

      updateDataFromFeatures(features) {
        this._points = (features || []).map(f => ({
          type: 'Feature',
          geometry: f.geometry,
          properties: f.properties || {}
        }));
        this._index.load(this._points);
        if (this._group) {
          this._render();
        }
      }

      _render() {
        if (!this._map || !this._group) return;
        const b = this._map.getBounds();
        const zoom = this._map.getZoom();
        const bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()];
        const items = this._index.getClusters(bbox, zoom);

        this._group.clearLayers();

        for (const it of items) {
          const [lon, lat] = it.geometry.coordinates;
          const ll = L.latLng(lat, lon);

          if (it.properties && it.properties.cluster) {
            const count = it.properties.point_count;
            const glyph = this.options.clusterGlyphSvg || '';
            const marker = L.marker(ll, {
              icon: L.divIcon({
                className: '',
                html: `<div class="cluster-badge">${glyph}${count}</div>`,
                iconSize: [44, 34],
                iconAnchor: [22, 17]
              })
            });
            marker.on('click', () => {
              const expansionZoom = Math.min(this._index.getClusterExpansionZoom(it.properties.cluster_id), 19);
              this._map.setView(ll, expansionZoom, { animate: true });
            });
            this._group.addLayer(marker);
          } else {
            const m = L.marker(ll, { icon: this.options.pointIcon });
            m.bindPopup(popupHtml(it.properties, this.options.categoryId));
            this._group.addLayer(m);
          }
        }
      }
    }

    async function loadGeoJSON(url) {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error(`Fetch failed for ${url}: HTTP ${r.status}`);
      const txt = await r.text();
      return JSON.parse(txt);
    }

    async function loadManifest() {
      const r = await fetch(MANIFEST_URL, { cache: 'no-store' });
      if (!r.ok) throw new Error(`Manifest konnte nicht geladen werden (HTTP ${r.status})`);
      const data = await r.json();
      const bundeslaender = Array.isArray(data.bundeslaender) ? data.bundeslaender : [];
      const categories = Array.isArray(data.categories) ? data.categories : [];
      return { bundeslaender, categories };
    }

    async function ensureLayer(bundeslandId, categoryId) {
      const key = comboKey(bundeslandId, categoryId);
      const existing = comboRegistry.get(key);
      if (existing) return existing;

      const url = `resources/geojson/${bundeslandId}/${categoryId}.geojson`;

      try {
        const geojson = await loadGeoJSON(url);
        const layer = new SuperclusterLayer(geojson, {
          minPoints: 10,
          radius: 60,
          pointIcon: iconForCategory(categoryId),
          clusterGlyphSvg: clusterGlyphForCategory(categoryId),
          categoryId,
          categoryLabel: categoryLabelMap[categoryId]
        });
        const entry = { status: 'ready', layer, visible: false, originalFeatures: geojson.features || [] };
        comboRegistry.set(key, entry);
        return entry;
      } catch (err) {
        if (!missingWarnings.has(key)) {
          console.warn(`GeoJSON fehlt für ${bundeslandId}/${categoryId}:`, err);
          missingWarnings.add(key);
        }
        const entry = { status: 'missing', visible: false };
        comboRegistry.set(key, entry);
        return entry;
      }
    }

    async function applyFilters() {
      const combos = [];
      filterState.bundeslaender.forEach((bundeslandId) => {
        filterState.kategorien.forEach((categoryId) => {
          combos.push({ key: comboKey(bundeslandId, categoryId), bundeslandId, categoryId });
        });
      });

      const targetKeys = new Set(combos.map(c => c.key));

      comboRegistry.forEach((entry, key) => {
        if (!targetKeys.has(key) && entry?.layer && entry.visible) {
          map.removeLayer(entry.layer);
          entry.visible = false;
        }
      });

      await Promise.all(combos.map(async ({ key, bundeslandId, categoryId }) => {
        const entry = await ensureLayer(bundeslandId, categoryId);
        if (!entry || entry.status !== 'ready') return;
        const feats = filteredFeatures(entry);
        entry.layer.updateDataFromFeatures(feats);
        if (!entry.visible) {
          entry.layer.addTo(map);
          entry.visible = true;
        }
      }));
    }

    function resetGpxState() {
      gpxState.points = [];
      gpxState.sampledPoints = [];
      gpxState.radiusMeters = DEFAULT_GPX_RADIUS_KM * 1000;
      gpxState.bbox = null;
      gpxState.active = false;
      const fileInput = document.getElementById('gpxFileInput');
      const radiusInput = document.getElementById('gpxRadiusKm');
      const err = document.getElementById('gpxError');
      if (fileInput) fileInput.value = '';
      if (radiusInput) radiusInput.value = String(DEFAULT_GPX_RADIUS_KM);
      if (err) err.textContent = '';
    }

    async function handleGpxApply() {
      const errorEl = document.getElementById('gpxError');
      const radiusInput = document.getElementById('gpxRadiusKm');
      const fileInput = document.getElementById('gpxFileInput');
      if (errorEl) errorEl.textContent = '';

      const clampedKm = clampRadiusKm(radiusInput ? radiusInput.value : DEFAULT_GPX_RADIUS_KM);
      if (radiusInput) radiusInput.value = String(clampedKm);
      const radiusMeters = clampedKm * 1000;

      let trackPoints = gpxState.points;
      const file = fileInput?.files?.[0];
      if (file) {
        try {
          const text = await readFileAsText(file);
          trackPoints = parseGpxText(text);
        } catch (err) {
          if (errorEl) errorEl.textContent = 'Datei konnte nicht gelesen werden.';
          return;
        }
      }

      if (!trackPoints || !trackPoints.length) {
        if (errorEl) errorEl.textContent = 'Bitte eine gültige GPX-Datei auswählen.';
        return;
      }

      const sampled = downsamplePoints(trackPoints);
      if (!sampled.length) {
        if (errorEl) errorEl.textContent = 'Keine Punkte in der GPX-Datei gefunden.';
        return;
      }

      gpxState.points = trackPoints;
      gpxState.sampledPoints = sampled;
      gpxState.radiusMeters = radiusMeters;
      gpxState.bbox = computeExpandedBBox(sampled, radiusMeters);
      gpxState.active = true;

      await applyFilters();
    }

    function resetAllFilters() {
      filterState.bundeslaender = new Set((manifestData.bundeslaender || []).map((b) => b.id));
      filterState.kategorien = new Set((manifestData.categories || []).map((c) => c.id));
      renderChecklist('blList', manifestData.bundeslaender, filterState.bundeslaender, 'bl');
      renderChecklist('catList', manifestData.categories, filterState.kategorien, 'cat');
      resetGpxState();
      triggerApplyFilters();
    }

    // User position marker + accuracy circle
    let userMarker = null;
    let userAccuracy = null;
    let watchId = null;

    function goToUserLocation({ centerOnFix = true, suppressErrorAlert = false } = {}) {
      if (!navigator.geolocation) {
        if (!suppressErrorAlert) {
          alert("Geolocation wird von diesem Browser nicht unterstützt.");
        }
        return;
      }

      let shouldCenter = centerOnFix;

      // Reuse watch if active; otherwise start it
      if (watchId == null) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude, longitude, accuracy } = pos.coords;
            const ll = [latitude, longitude];

            if (!userMarker) {
              userMarker = L.circleMarker(ll, { radius: 8, weight: 2, opacity: 0.95, fillOpacity: 0.8 }).addTo(map);
              userMarker.bindPopup("Deine Position");
            } else {
              userMarker.setLatLng(ll);
            }

            if (!userAccuracy) {
              userAccuracy = L.circle(ll, { radius: accuracy, weight: 1, opacity: 0.35, fillOpacity: 0.08 }).addTo(map);
            } else {
              userAccuracy.setLatLng(ll);
              userAccuracy.setRadius(accuracy);
            }

            if (shouldCenter) {
              map.setView(ll, Math.max(map.getZoom(), 15), { animate: true });
              shouldCenter = false;
            }
          },
          (err) => {
            if (!suppressErrorAlert) {
              alert("Standort konnte nicht ermittelt werden: " + err.message);
            }
          },
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
        );
      } else if (shouldCenter && userMarker) {
        map.setView(userMarker.getLatLng(), Math.max(map.getZoom(), 15), { animate: true });
      }
    }

    (async () => {
      manifestData = await loadManifest();
      categoryLabelMap = (manifestData.categories || []).reduce((acc, cat) => {
        acc[cat.id] = cat.label;
        return acc;
      }, {});

      manifestData.bundeslaender.forEach(bl => filterState.bundeslaender.add(bl.id));
      manifestData.categories.forEach(cat => filterState.kategorien.add(cat.id));

      renderChecklist('blList', manifestData.bundeslaender, filterState.bundeslaender, 'bl');
      renderChecklist('catList', manifestData.categories, filterState.kategorien, 'cat');
      setAccordionHandlers();
      setupDrawer();
      setupDrawerWidthMeasurement();
      setupThemeToggle();

      await applyFilters();

      document.getElementById('locateButton').addEventListener('click', () => goToUserLocation({ centerOnFix: true }));

      document.getElementById('blSelectAll').addEventListener('click', () => selectAll(manifestData.bundeslaender, filterState.bundeslaender, 'blList', 'bl'));
      document.getElementById('blSelectNone').addEventListener('click', () => selectNone(filterState.bundeslaender, 'blList', 'bl', manifestData.bundeslaender));
      document.getElementById('catSelectAll').addEventListener('click', () => selectAll(manifestData.categories, filterState.kategorien, 'catList', 'cat'));
      document.getElementById('catSelectNone').addEventListener('click', () => selectNone(filterState.kategorien, 'catList', 'cat', manifestData.categories));

      const radiusInput = document.getElementById('gpxRadiusKm');
      if (radiusInput) {
        radiusInput.addEventListener('change', () => {
          radiusInput.value = String(clampRadiusKm(radiusInput.value));
        });
      }
      const gpxApplyBtn = document.getElementById('gpxApplyBtn');
      if (gpxApplyBtn) {
        gpxApplyBtn.addEventListener('click', () => { handleGpxApply().catch(err => console.error(err)); });
      }
      const resetBtn = document.getElementById('resetAllBtn');
      if (resetBtn) {
        resetBtn.addEventListener('click', resetAllFilters);
      }

      goToUserLocation({ centerOnFix: true, suppressErrorAlert: true });
    })().catch(err => {
      console.error(err);
      alert("Fehler beim Laden: " + (err.message || err));
      map.setView(FALLBACK_VIEW.center, FALLBACK_VIEW.zoom);
    });
  </script>
