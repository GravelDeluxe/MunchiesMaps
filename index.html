<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Testkarte – Clustering ab 10 + Layer Dropdown + Standort</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }

    /* Custom controls */
    .ctl {
      background: rgba(255,255,255,0.92);
      padding: 8px 10px;
      border-radius: 10px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.15);
      font: 13px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      position: relative;
    }
    .dropdown-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 38px;
      height: 38px;
      padding: 6px;
      min-width: 0;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.18);
      background: #fff;
      cursor: pointer;
      font-weight: 650;
    }
    .dropdown-btn:active { transform: translateY(1px); }
    .dropdown-panel {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 6px;
      background: rgba(255,255,255,0.97);
      border-radius: 10px;
      box-shadow: 0 1px 10px rgba(0,0,0,0.22);
      padding: 10px 12px;
      border: 1px solid rgba(0,0,0,0.1);
      min-width: 220px;
      z-index: 2000;
      display: none;
    }
    .dropdown-panel.open { display: block; }
    .dropdown-panel .title {
      font-weight: 700;
      margin-bottom: 8px;
    }
    .layer-option { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .layer-option:last-child { margin-bottom: 0; }
    .layer-option input { width: 16px; height: 16px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.18);
      background: rgba(255,255,255,0.92);
      box-shadow: 0 1px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      user-select: none;
      font: 13px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .btn:active { transform: translateY(1px); }

    /* Cluster icon */
    .cluster-badge {
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 750;
      border: 1px solid rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.92);
      box-shadow: 0 1px 6px rgba(0,0,0,0.15);
      min-width: 34px;
      text-align: center;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .cluster-badge svg { width: 14px; height: 14px; display:block; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/supercluster@8.0.1/dist/supercluster.min.js"></script>

  <script>
    const map = L.map('map', { zoomControl: true, preferCanvas: true });

    const FALLBACK_VIEW = { center: [52.52, 13.405], zoom: 11 };
    // Ensure the map has an initial view before any custom layers render.
    map.setView(FALLBACK_VIEW.center, FALLBACK_VIEW.zoom);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap-Mitwirkende'
    }).addTo(map);

    function popupHtml(props) {
      const p = props || {};
      const name = p.name || '(ohne Name)';
      const desc = p.description ? p.description : '';
      const other = Object.keys(p)
        .filter(k => !['name','description','cluster','cluster_id','point_count','point_count_abbreviated'].includes(k))
        .filter(k => p[k] != null && String(p[k]).trim() !== '')
        .slice(0, 20)
        .map(k => `<div><b>${k}</b>: ${String(p[k])}</div>`)
        .join('');
      return `
        <div style="font: 13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 320px;">
          <div style="font-weight: 700; margin-bottom: 6px;">${name}</div>
          ${desc ? `<div style="margin-bottom: 8px;">${desc}</div>` : ''}
          ${other ? `<div style="border-top: 1px solid rgba(0,0,0,0.1); padding-top: 8px;">${other}</div>` : ''}
        </div>
      `;
    }

    // Simple SVG icons (circle + glyph)
    function svgIcon(glyphSvgPathD) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
          <circle cx="14" cy="14" r="12" fill="white" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>
          <path d="${glyphSvgPathD}" fill="rgba(0,0,0,0.85)"/>
        </svg>
      `.trim();
      return L.divIcon({
        className: '',
        html: svg,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14]
      });
    }

    // Water drop glyph (simple)
    const waterDropPath = "M14 6 C11 10,9 12,9 15 a5 5 0 0 0 10 0 c0-3-2-5-5-9 z";
    // Vending machine glyph (simplified rectangle + slots)
    const vendingPath = "M10 7 h8 a1 1 0 0 1 1 1 v12 a1 1 0 0 1-1 1 h-8 a1 1 0 0 1-1-1 v-12 a1 1 0 0 1 1-1 z M11.5 9.2 h5 v2.2 h-5 z M11.5 12.3 h5 v1.3 h-5 z M11.5 14.4 h5 v1.3 h-5 z M12 17.2 h4 v2 h-4 z";

    function clusterGlyph(glyphPathD) {
      return `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" aria-hidden="true">
          <path d="${glyphPathD}" fill="rgba(0,0,0,0.8)"/>
        </svg>
      `.trim();
    }

    const ICONS = {
      water: svgIcon(waterDropPath),
      vending: svgIcon(vendingPath)
    };

    const LAYERS = {
      layer1: {
        name: "Layer 1 – Wasser",
        geojson: "layer1_points.geojson",
        iconType: "water",
        clusterGlyphSvg: clusterGlyph(waterDropPath)
      },
      layer2: {
        name: "Layer 2 – Automat",
        geojson: "layer2_points.geojson",
        iconType: "vending",
        clusterGlyphSvg: clusterGlyph(vendingPath)
      }
    };

    const DEFAULT_LAYER_MODE = Object.keys(LAYERS)[0] || "layer1";

    class SuperclusterLayer extends L.Layer {
      constructor(geojson, options) {
        super();
        this.options = options || {};
        this._index = new Supercluster({
          radius: this.options.radius ?? 60,
          maxZoom: this.options.maxZoom ?? 18,
          minPoints: this.options.minPoints ?? 10
        });
        this._points = (geojson.features || []).map(f => ({
          type: 'Feature',
          geometry: f.geometry,
          properties: f.properties || {}
        }));
        this._index.load(this._points);
        this._render = this._render.bind(this);
      }

      onAdd(map) {
        this._map = map;
        this._group = L.layerGroup().addTo(map);
        map.on('moveend zoomend', this._render);
        this._render();
      }

      onRemove(map) {
        map.off('moveend zoomend', this._render);
        map.removeLayer(this._group);
        this._group = null;
        this._map = null;
      }

      getBounds() {
        const coords = this._points.map(p => p.geometry.coordinates);
        if (!coords.length) return null;
        let minX=coords[0][0], minY=coords[0][1], maxX=coords[0][0], maxY=coords[0][1];
        for (const [x,y] of coords) {
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
        return L.latLngBounds([minY, minX], [maxY, maxX]);
      }

      _render() {
        if (!this._map || !this._group) return;
        const b = this._map.getBounds();
        const zoom = this._map.getZoom();
        const bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()];
        const items = this._index.getClusters(bbox, zoom);

        this._group.clearLayers();

        for (const it of items) {
          const [lon, lat] = it.geometry.coordinates;
          const ll = L.latLng(lat, lon);

          if (it.properties && it.properties.cluster) {
            const count = it.properties.point_count;
            const glyph = this.options.clusterGlyphSvg || '';
            const marker = L.marker(ll, {
              icon: L.divIcon({
                className: '',
                html: `<div class="cluster-badge">${glyph}${count}</div>`,
                iconSize: [44, 34],
                iconAnchor: [22, 17]
              })
            });
            marker.on('click', () => {
              const expansionZoom = Math.min(this._index.getClusterExpansionZoom(it.properties.cluster_id), 19);
              this._map.setView(ll, expansionZoom, { animate: true });
            });
            this._group.addLayer(marker);
          } else {
            const m = L.marker(ll, { icon: this.options.pointIcon });
            m.bindPopup(popupHtml(it.properties));
            this._group.addLayer(m);
          }
        }
      }
    }

    async function loadGeoJSON(url) {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error(`Fetch failed for ${url}: HTTP ${r.status}`);
      const txt = await r.text();
      return JSON.parse(txt);
    }

    // Dropdown control with checkbox list (closes on outside click)
    function createLayerDropdown(layerDefs, onToggle, getActive) {
      return L.Control.extend({
        onAdd: function() {
          const wrap = L.DomUtil.create('div', 'ctl');
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'dropdown-btn';
          const gear = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="none" d="M0 0h24v24H0z" />
              <path d="M9.875 4.5c.207-.615.806-1.027 1.452-1.027h1.346c.646 0 1.245.412 1.452 1.027l.28.835c.103.306.348.545.657.643l.96.303c.629.198 1.321-.025 1.702-.55l.315-.436a1.55 1.55 0 0 1 2.12-.38l1.164.775c.546.364.76 1.05.51 1.664l-.314.785c-.115.29-.07.618.122.869l.623.81c.407.53.407 1.264 0 1.793l-.623.81a1.05 1.05 0 0 0-.122.869l.314.785c.25.614.036 1.3-.51 1.664l-1.164.775a1.55 1.55 0 0 1-2.12-.38l-.315-.436c-.381-.525-1.073-.748-1.702-.55l-.96.303a1.15 1.15 0 0 0-.657.643l-.28.835c-.207.615-.806 1.027-1.452 1.027h-1.346c-.646 0-1.245-.412-1.452-1.027l-.28-.835a1.15 1.15 0 0 0-.657-.643l-.96-.303c-.629-.198-1.321.025-1.702.55l-.315.436a1.55 1.55 0 0 1-2.12.38l-1.164-.775c-.546-.364-.76-1.05-.51-1.664l.314-.785c.115-.29.07-.618-.122-.869l-.623-.81a1.269 1.269 0 0 1 0-1.793l.623-.81c.192-.25.237-.579.122-.869l-.314-.785c-.25-.614-.036-1.3.51-1.664l1.164-.775a1.55 1.55 0 0 1 2.12.38l.315.436c.381.525 1.073.748 1.702.55l.96-.303c.309-.098.554-.337.657-.643zM12 9.75a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5z" fill="currentColor" />
            </svg>
          `.trim();
          btn.innerHTML = gear;
          btn.setAttribute('aria-label', 'Layer auswählen');
          btn.setAttribute('aria-haspopup', 'true');
          btn.setAttribute('aria-expanded', 'false');

          const panel = document.createElement('div');
          panel.className = 'dropdown-panel';
          panel.innerHTML = '<div class="title">Layer auswählen</div>';

          // Build checkbox list from provided layer definitions
          layerDefs.forEach(ld => {
            const row = document.createElement('label');
            row.className = 'layer-option';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.value = ld.id;
            cb.checked = getActive().has(ld.id);
            cb.addEventListener('change', (e) => onToggle(ld.id, e.target.checked));

            const text = document.createElement('span');
            text.textContent = ld.label;
            row.appendChild(cb);
            row.appendChild(text);
            panel.appendChild(row);
          });

          const closePanel = () => {
            panel.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
          };
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const nextOpen = !panel.classList.contains('open');
            panel.classList.toggle('open');
            btn.setAttribute('aria-expanded', nextOpen ? 'true' : 'false');
          });

          const onDocClick = (e) => {
            if (!wrap.contains(e.target)) closePanel();
          };
          document.addEventListener('click', onDocClick);

          const onKey = (e) => {
            if (e.key === 'Escape') closePanel();
          };
          document.addEventListener('keydown', onKey);

          // Clean up when control is removed
          this.onRemove = function() {
            document.removeEventListener('click', onDocClick);
            document.removeEventListener('keydown', onKey);
          };

          wrap.appendChild(btn);
          wrap.appendChild(panel);
          L.DomEvent.disableClickPropagation(wrap);
          return wrap;
        }
      });
    }

    // Locate button
    const LocateButton = L.Control.extend({
      onAdd: function(map) {
        const btn = L.DomUtil.create('div', 'btn');
        btn.title = "Zu meiner Position";
        btn.innerHTML = "Standort";
        L.DomEvent.on(btn, 'click', () => startLocate(true));
        L.DomEvent.disableClickPropagation(btn);
        return btn;
      }
    });

    // Active layer IDs are stored in this Set so we can quickly sync map state with checkboxes.
    const activeLayers = new Set();

    // Central registry so checkbox handlers can map IDs to Leaflet layers.
    const layerRegistry = {};

    // Checkbox change calls this helper to attach/detach the matching Leaflet layer right away.
    function toggleLayer(id, enable) {
      const layer = layerRegistry[id];
      if (!layer) return;

      // Update state set first so UI and map stay in sync.
      if (enable) {
        activeLayers.add(id);
        layer.addTo(map);
      } else {
        activeLayers.delete(id);
        map.removeLayer(layer);
      }
    }

    function fitToActiveBounds() {
      const boundsList = Array.from(activeLayers)
        .map(id => layerRegistry[id]?.getBounds())
        .filter(Boolean);

      if (!boundsList.length) {
        map.setView(FALLBACK_VIEW.center, FALLBACK_VIEW.zoom);
        return;
      }

      // Leaflet's LatLngBounds doesn't expose a clone method, so use pad(0) to copy.
      const merged = boundsList.slice(1).reduce(
        (acc, b) => acc.extend(b),
        boundsList[0].pad(0)
      );
      map.fitBounds(merged, { padding: [30, 30], maxZoom: 17 });
    }

    // User position marker + accuracy circle
    let userMarker = null;
    let userAccuracy = null;
    let watchId = null;

    function startLocate(centerOnFix) {
      if (!navigator.geolocation) {
        alert("Geolocation wird von diesem Browser nicht unterstützt.");
        return;
      }

      // Reuse watch if active; otherwise start it
      if (watchId == null) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude, longitude, accuracy } = pos.coords;
            const ll = [latitude, longitude];

            if (!userMarker) {
              userMarker = L.circleMarker(ll, { radius: 8, weight: 2, opacity: 0.95, fillOpacity: 0.8 }).addTo(map);
              userMarker.bindPopup("Deine Position");
            } else {
              userMarker.setLatLng(ll);
            }

            if (!userAccuracy) {
              userAccuracy = L.circle(ll, { radius: accuracy, weight: 1, opacity: 0.35, fillOpacity: 0.08 }).addTo(map);
            } else {
              userAccuracy.setLatLng(ll);
              userAccuracy.setRadius(accuracy);
            }

            if (centerOnFix) {
              map.setView(ll, Math.max(map.getZoom(), 15), { animate: true });
              centerOnFix = false;
            }
          },
          (err) => {
            alert("Standort konnte nicht ermittelt werden: " + err.message);
          },
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
        );
      } else if (centerOnFix && userMarker) {
        map.setView(userMarker.getLatLng(), Math.max(map.getZoom(), 15), { animate: true });
      }
    }

    (async () => {
      const loadedEntries = await Promise.all(
        Object.entries(LAYERS).map(async ([key, cfg]) => {
          const geojson = await loadGeoJSON(cfg.geojson);
          const layer = new SuperclusterLayer(geojson, {
            minPoints: 10,
            radius: 60,
            pointIcon: ICONS[cfg.iconType],
            clusterGlyphSvg: cfg.clusterGlyphSvg
          });
          return [key, layer];
        })
      );

      const layers = Object.fromEntries(loadedEntries);
      Object.assign(layerRegistry, layers);

      const layerDefs = Object.entries(LAYERS).map(([id, cfg]) => ({ id, label: cfg.name }));

      // Default layer selection: keep initial state aligned with checkboxes
      toggleLayer(DEFAULT_LAYER_MODE, true);

      // Add controls
      const dropdown = new (createLayerDropdown(layerDefs, toggleLayer, () => activeLayers))({ position: 'topright' });
      map.addControl(dropdown);

      const loc = new LocateButton({ position: 'bottomright' });
      map.addControl(loc);

      // Fit bounds of both layers so switching doesn't feel "empty"
      fitToActiveBounds();
    })().catch(err => {
      console.error(err);
      alert("Fehler beim Laden: " + (err.message || err));
      map.setView(FALLBACK_VIEW.center, FALLBACK_VIEW.zoom);
    });
  </script>
</body>
</html>
