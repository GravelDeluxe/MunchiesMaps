<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MunchiesMaps by nightrides.cc – alpha</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --border: rgba(0,0,0,0.12);
      --icon-border: rgba(0,0,0,0.18);
      --btn-bg: rgba(255,255,255,0.95);
      --btn-text: #0f172a;
      --btn-border: rgba(0,0,0,0.18);
      --btn-shadow: 0 2px 10px rgba(0,0,0,0.18);
      --overlay: rgba(0,0,0,0.35);
      --action-bg: rgba(245,245,245,0.92);
      --switch-bg: #e5e7eb;
      --switch-thumb: #ffffff;
      --control-bg: rgba(255,255,255,0.96);
      --control-bg-hover: rgba(245,245,245,0.96);
      --control-text: #0f172a;
      --control-border: rgba(0,0,0,0.18);
      --popup-bg: #ffffff;
      --popup-text: #111827;
      --popup-border: rgba(0,0,0,0.12);
    }

    .theme-dark {
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #cbd5e1;
      --border: rgba(255,255,255,0.14);
      --icon-border: rgba(255,255,255,0.36);
      --btn-bg: rgba(30,41,59,0.92);
      --btn-text: #e5e7eb;
      --btn-border: rgba(255,255,255,0.18);
      --btn-shadow: 0 2px 12px rgba(0,0,0,0.45);
      --overlay: rgba(0,0,0,0.55);
      --action-bg: rgba(45,55,72,0.85);
      --switch-bg: #1e293b;
      --switch-thumb: #0ea5e9;
      --control-bg: rgba(30,41,59,0.95);
      --control-bg-hover: rgba(46,58,76,0.95);
      --control-text: #e5e7eb;
      --control-border: rgba(255,255,255,0.2);
      --popup-bg: #0f172a;
      --popup-text: #e5e7eb;
      --popup-border: rgba(255,255,255,0.18);
    }

    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    #map { height: 100%; width: 100%; }

    /* Drawer + overlay */
    .map-controls-br {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 1035;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #layerDrawerToggle,
    #locateButton {
      padding: 10px 14px;
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      background: var(--btn-bg);
      box-shadow: var(--btn-shadow);
      color: var(--btn-text);
      font: 14px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-weight: 700;
      cursor: pointer;
    }
    #layerDrawerToggle:active,
    #locateButton:active { transform: translateY(1px); }

    #layerDrawerBackdrop {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 1040;
    }
    #layerDrawerBackdrop.open { opacity: 1; pointer-events: all; }

    #layerDrawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: auto;
      max-width: min(92vw, 420px);
      min-width: 260px;
      background: var(--panel);
      box-shadow: -2px 0 16px rgba(0,0,0,0.2);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 1055;
      display: flex;
      flex-direction: column;
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
    }
    #layerDrawer.open { transform: translateX(0); }
    #layerDrawer header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    #layerDrawer header h2 { margin: 0; font-size: 18px; }
    #layerDrawer header button {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 6px;
      color: var(--text);
    }
    #layerDrawer .drawer-body { flex: 1; overflow: auto; padding: 0 16px 18px; }
    #layerDrawer .section { border-bottom: 1px solid var(--border); }
    #layerDrawer .section:last-of-type { border-bottom: none; }
    .accordion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      cursor: pointer;
      font-weight: 700;
      gap: 12px;
      color: var(--text);
    }
    .accordion-header span { flex: 1; }
    .accordion-header .chevron {
      transition: transform 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-size: 16px;
    }
    .accordion-header[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
    .accordion-body { padding: 0 0 14px; display: none; color: var(--text); }
    .accordion-body.open { display: block; }
    .action-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .action-row button {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--btn-border);
      background: var(--action-bg);
      cursor: pointer;
      font-weight: 650;
      color: var(--text);
    }
    .checklist { display: flex; flex-direction: column; gap: 8px; }
    .checklist .checkrow { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); }
    .checklist input[type="checkbox"] { width: 16px; height: 16px; }
    .cat-icon { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; overflow: hidden; flex: 0 0 auto; background: transparent; border: 1px solid transparent; box-sizing: border-box; }
    .cat-icon img { width: 100%; height: 100%; display: block; }
    .cat-icon--list { width: 22px; height: 22px; }
    .cat-icon--popup { width: 20px; height: 20px; }
    .cat-icon--map { width: 34px; height: 34px; }
    .cat-icon--cluster { width: 22px; height: 22px; }
    .cat-icon--water { border-color: var(--icon-border); }
    /* Custom controls */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      box-shadow: 0 1px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      user-select: none;
      font: 13px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--btn-text);
    }
    .btn:active { transform: translateY(1px); }

    /* Drawer bottom */
    .drawer-bottom {
      border-top: 1px solid var(--border);
      padding: 12px 16px 16px;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      color: var(--text);
      user-select: none;
    }
    .theme-toggle input { display: none; }
    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
      border-radius: 999px;
      background: var(--switch-bg);
      border: 1px solid var(--border);
      transition: background 0.2s ease;
      flex-shrink: 0;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--switch-thumb);
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      transition: transform 0.2s ease;
    }
    .theme-toggle input:checked + .toggle-switch::after { transform: translateX(22px); }

    .gpx-inputs { display: flex; flex-direction: column; gap: 10px; }
    .gpx-row { display: flex; flex-direction: column; gap: 6px; }
    .gpx-row label { font-weight: 650; color: var(--text); }
    .gpx-row input[type="number"] { width: 120px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
    .gpx-row input[type="file"] { color: var(--text); }

    .cluster-row { display: flex; flex-direction: column; gap: 6px; }
    .cluster-row label { font-weight: 650; color: var(--text); }
    .cluster-row input[type="number"] { width: 160px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
    .cluster-helper { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .gpx-apply { align-self: flex-start; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--btn-border); background: var(--action-bg); cursor: pointer; font-weight: 700; color: var(--text); }
    .gpx-error { color: #dc2626; font-size: 13px; }

    .drawer-reset-btn { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--btn-border); background: var(--action-bg); cursor: pointer; font-weight: 750; color: var(--text); }

    /* Cluster icon */
    .cluster-icon-wrap {
      background: transparent;
      border: none;
    }
    .cluster-icon {
      --cluster-size: 40px;
      width: var(--cluster-size);
      height: var(--cluster-size);
      border-radius: 999px;
      background: linear-gradient(135deg, #e5e7eb, #9ca3af);
      border: 2px solid rgba(75, 85, 99, 0.85);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .cluster-icon--small { --cluster-size: 34px; }
    .cluster-icon--medium { --cluster-size: 40px; }
    .cluster-icon--large { --cluster-size: 48px; }
    .cluster-icon span {
      color: inherit;
      font-weight: 800;
      font-size: 14px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    /* Map controls */
    .leaflet-bar a,
    .leaflet-bar a:link,
    .leaflet-bar a:visited {
      background: var(--control-bg);
      color: var(--control-text);
      border-bottom: 1px solid var(--control-border);
      box-shadow: none;
    }
    .leaflet-bar a:last-child { border-bottom: none; }
    .leaflet-bar a:hover { background: var(--control-bg-hover); color: var(--control-text); }
    .leaflet-bar,
    .leaflet-control-zoom {
      border: 1px solid var(--control-border);
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
      border-radius: 10px;
      overflow: hidden;
    }
    .leaflet-touch .leaflet-bar a { color: var(--control-text); }

    /* Popups */
    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: var(--popup-bg);
      color: var(--popup-text);
      border: 1px solid var(--popup-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .leaflet-popup-content { color: var(--popup-text); }
    .leaflet-popup-close-button { color: var(--popup-text); }
    .leaflet-popup-content a { color: var(--btn-text); }

    .popup-content { font: 13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 320px; color: var(--popup-text); }
    .popup-title { font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .popup-cat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--popup-border); background: rgba(0,0,0,0.03); }
    .theme-dark .popup-cat { background: rgba(255,255,255,0.06); }
    .popup-desc { margin-bottom: 8px; }
    .popup-extra { border-top: 1px solid var(--popup-border); padding-top: 8px; }
    .popup-footer { border-top: 1px solid var(--popup-border); margin-top: 8px; padding-top: 8px; }
    .popup-footer a { font-weight: 600; text-decoration: none; }
    .popup-footer a:hover,
    .popup-footer a:focus { text-decoration: underline; }
  </style>
  <script>
    (function() {
      const storedTheme = localStorage.getItem('theme');
      const isDark = storedTheme === 'dark';
      document.documentElement.classList.toggle('theme-dark', isDark);
      document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      window.__themePreference = isDark ? 'dark' : 'light';
      window.__isDarkTheme = isDark;
    })();
  </script>
</head>
<body>
    <div id="map"></div>
    <div class="map-controls-br">
      <button id="locateButton" type="button" aria-label="Center my location">My location</button>
      <button id="layerDrawerToggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Open filters">Filters</button>
    </div>
    <div id="layerDrawerBackdrop" aria-hidden="true"></div>
  <aside id="layerDrawer" aria-hidden="true" aria-label="Filters">
    <header>
      <h2>Filters</h2>
      <button type="button" id="layerDrawerClose" aria-label="Close">×</button>
    </header>
    <div class="drawer-body">
      <div class="section" id="bundeslandSection">
        <div class="accordion-header" data-target="blSection" aria-expanded="false" role="button" tabindex="0">
          <span>State</span>
          <span class="chevron">⌄</span>
        </div>
        <div class="accordion-body" id="blSection">
          <div class="action-row">
            <button type="button" id="blSelectAll">Select all</button>
            <button type="button" id="blSelectNone">Select none</button>
          </div>
          <div class="checklist" id="blList"></div>
        </div>
      </div>
      <div class="section" id="kategorieSection">
        <div class="accordion-header" data-target="catSection" aria-expanded="false" role="button" tabindex="0">
          <span>Category</span>
          <span class="chevron">⌄</span>
        </div>
        <div class="accordion-body" id="catSection">
          <div class="action-row">
            <button type="button" id="catSelectAll">Select all</button>
            <button type="button" id="catSelectNone">Select none</button>
          </div>
          <div class="checklist" id="catList"></div>
        </div>
      </div>
      <div class="section" id="clusterSection">
        <div class="accordion-header" data-target="clusterBody" aria-expanded="false" role="button" tabindex="0">
          <span>Clustering</span>
          <span class="chevron">⌄</span>
        </div>
        <div class="accordion-body" id="clusterBody">
          <div class="cluster-row">
            <label for="clusterThresholdInput">Enable clustering above (visible POIs)</label>
            <input type="number" id="clusterThresholdInput" min="0" step="1" />
            <p class="cluster-helper">Clusters appear only when more than X POIs are visible in the current map view.</p>
          </div>
        </div>
      </div>
      <div class="section" id="gpxSection">
        <div class="accordion-header" data-target="gpxBody" aria-expanded="false" role="button" tabindex="0">
          <span>GPX import</span>
          <span class="chevron">⌄</span>
        </div>
        <div class="accordion-body" id="gpxBody">
          <div class="gpx-inputs">
            <div class="gpx-row">
              <label for="gpxFileInput">GPX file</label>
              <input type="file" id="gpxFileInput" accept=".gpx" />
            </div>
            <div class="gpx-row">
              <label for="gpxRadiusKm">Radius (km)</label>
              <input type="number" id="gpxRadiusKm" min="0" step="0.1" value="0.3" />
            </div>
            <button type="button" class="gpx-apply" id="gpxApplyBtn">Apply</button>
            <div class="gpx-error" id="gpxError" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="drawer-bottom">
      <button type="button" id="resetAllBtn" class="drawer-reset-btn">Reset</button>
      <label class="theme-toggle" for="darkModeToggle">
        <span>Dark mode</span>
        <input type="checkbox" id="darkModeToggle" aria-label="Toggle dark mode" />
        <span class="toggle-switch" aria-hidden="true"></span>
      </label>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    const THEME_KEY = 'theme';
    const CLUSTER_THRESHOLD_KEY = 'clusterThreshold';

    const DEFAULT_CLUSTER_THRESHOLD = 200;

    const CATEGORY_STYLE = {
      fuel: { color: '#1d4ed8', icon: 'resources/icons/fuel.svg' },
      supermarkets: { color: '#2e7d32', icon: 'resources/icons/supermarkets.svg' },
      drinking_water: { color: '#ffffff', icon: 'resources/icons/drinking_water.svg' },
      shelters: { color: '#0f766e', icon: 'resources/icons/shelters.svg' },
      bakerys_cafes: { color: '#f59e0b', icon: 'resources/icons/bakeries.svg' },
      kiosks: { color: '#10b981', icon: 'resources/icons/kiosks.svg' },
      fast_food: { color: '#f97316', icon: 'resources/icons/default.svg' },
      burger_king: { color: '#f97316', icon: 'resources/icons/burger_king.svg' },
      mcdonalds: { color: '#facc15', icon: 'resources/icons/mcdonalds.svg' },
      toilets_public: { color: '#38bdf8', icon: 'resources/icons/toilets_public.svg' },
      vending_snacks: { color: '#eab308', icon: 'resources/icons/vending_snacks.svg' },
      default: { color: '#6b7280', icon: 'resources/icons/default.svg' }
    };

    function categoryStyle(categoryId) {
      return CATEGORY_STYLE[categoryId] || CATEGORY_STYLE.default;
    }

    function categoryColor(categoryId) {
      return categoryStyle(categoryId).color;
    }

    function categoryIconPath(categoryId) {
      const style = categoryStyle(categoryId);
      return style.icon || CATEGORY_STYLE.default.icon;
    }

    function createCategoryIconElement(categoryId, size = 22, extraClass = '') {
      const el = document.createElement('span');
      el.className = ['cat-icon', extraClass].filter(Boolean).join(' ');
      if (categoryId === 'drinking_water') el.classList.add('cat-icon--water');
      el.style.width = `${size}px`;
      el.style.height = `${size}px`;
      const img = document.createElement('img');
      img.src = categoryIconPath(categoryId);
      img.alt = '';
      img.setAttribute('aria-hidden', 'true');
      img.loading = 'lazy';
      el.appendChild(img);
      return el;
    }

    function categoryIconHtml(categoryId, size = 22, extraClass = '') {
      const classes = ['cat-icon', extraClass];
      if (categoryId === 'drinking_water') classes.push('cat-icon--water');
      const cls = classes.filter(Boolean).join(' ');
      const dim = `${size}px`;
      return `<span class="${cls}" style="width:${dim};height:${dim};"><img src="${categoryIconPath(categoryId)}" alt="" aria-hidden="true" loading="lazy" /></span>`;
    }

    let categoryLabelMap = {};

    let baseLayers = null;
    let activeBaseLayer = null;

    function applyTheme(isDark) {
      const nextIsDark = isDark === true;
      const next = nextIsDark ? 'dark' : 'light';
      document.documentElement.classList.toggle('theme-dark', nextIsDark);
      document.documentElement.dataset.theme = next;
      updateMapTheme(next);
    }

    function updateMapTheme(theme) {
      if (!window.map || !baseLayers) return;
      const target = theme === 'dark' ? 'dark' : 'light';
      const nextLayer = baseLayers[target];
      if (!nextLayer) return;

      if (activeBaseLayer && activeBaseLayer !== nextLayer) {
        map.removeLayer(activeBaseLayer);
      }

      if (!map.hasLayer(nextLayer)) {
        nextLayer.addTo(map);
      }
      if (typeof nextLayer.bringToBack === 'function') {
        nextLayer.bringToBack();
      }
      activeBaseLayer = nextLayer;
    }

    function setupThemeToggle() {
      const toggle = document.getElementById('darkModeToggle');
      if (!toggle) return;
      const initial = window.__isDarkTheme === true;
      toggle.checked = initial;

      toggle.addEventListener('change', () => {
        const isDark = toggle.checked;
        applyTheme(isDark);
        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      });
    }

      const map = L.map('map', { zoomControl: true, preferCanvas: true });
      window.map = map;

    const FALLBACK_VIEW = { center: [52.52, 13.405], zoom: 11 };
    // Ensure the map has an initial view before any custom layers render.
    map.setView(FALLBACK_VIEW.center, FALLBACK_VIEW.zoom);

    map.on('popupopen', (e) => {
      const popupEl = e.popup && e.popup.getElement ? e.popup.getElement() : null;
      if (!popupEl) return;
      const link = popupEl.querySelector('a.open-gmaps');
      if (!link) return;

      if (link.__gmapsBound) return;
      link.__gmapsBound = true;

      link.addEventListener('click', (evt) => {
        const lat = link.dataset.lat;
        const lng = link.dataset.lng;
        if (!lat || !lng) return;

        if (isIOS()) {
          evt.preventDefault();

          const appUrl = googleMapsIOSSchemeUrl(lat, lng);
          const webUrl = googleMapsWebUrl(lat, lng);

          let didLeavePage = false;
          let fallbackTimer = null;

          const cancelFallback = () => {
            didLeavePage = true;
            if (fallbackTimer) clearTimeout(fallbackTimer);
            fallbackTimer = null;
          };

          const onVis = () => {
            if (document.visibilityState === 'hidden') cancelFallback();
          };
          const onPageHide = () => cancelFallback();
          const onBlur = () => cancelFallback();

          document.addEventListener('visibilitychange', onVis, { passive: true });
          window.addEventListener('pagehide', onPageHide, { passive: true });
          window.addEventListener('blur', onBlur, { passive: true });

          window.location.href = appUrl;

          fallbackTimer = setTimeout(() => {
            document.removeEventListener('visibilitychange', onVis);
            window.removeEventListener('pagehide', onPageHide);
            window.removeEventListener('blur', onBlur);

            if (!didLeavePage && document.visibilityState === 'visible') {
              window.location.assign(webUrl);
            }
          }, 1200);
        }
      }, { passive: false });
    });

    const LIGHT_TILES = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });
    const DARK_TILES = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',

    function debounce(fn, delay) {
      let t = null;
      return (...args) => {
        if (t) clearTimeout(t);
        t = setTimeout(() => fn(...args), delay);

    }

    function clampRadiusKm(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return 0;
      const clamped = Math.max(0, numeric);
      return Math.round(clamped * 10) / 10;
    }

    function formatRadiusKm(value) {
      return clampRadiusKm(value).toFixed(1);
    }

    function parseClusterThreshold(value) {
      if (value == null) return DEFAULT_CLUSTER_THRESHOLD;
      const numeric = Number(value);
      if (!Number.isFinite(numeric) || numeric < 0) return DEFAULT_CLUSTER_THRESHOLD;
      return Math.max(0, Math.floor(numeric));
    }

    function clampClusterThreshold(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric) || numeric < 0) return 0;
      return Math.max(0, Math.floor(numeric));
    }

    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('Could not read the file.'));
        reader.readAsText(file);
      });
    }

    function getElementsByLocalName(xml, name) {
      const byNs = xml.getElementsByTagNameNS ? xml.getElementsByTagNameNS('*', name) : [];
      if (byNs && byNs.length) return Array.from(byNs);
      return Array.from(xml.getElementsByTagName(name));
    }

    function parseGpxText(text) {
      try {
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, 'application/xml');
        if (xml.getElementsByTagName('parsererror').length) {
          return { points: [], xml: null };
        }

        const extractPoints = (tagName) => {
          return getElementsByLocalName(xml, tagName)
            .map((el) => {
              const lat = parseFloat(el.getAttribute('lat'));
              const lon = parseFloat(el.getAttribute('lon'));
              if (Number.isFinite(lat) && Number.isFinite(lon)) {
                return { lat, lon };
              }
              return null;
            })
            .filter(Boolean);
        };

        let pts = extractPoints('trkpt');
        if (!pts.length) pts = extractPoints('rtept');
        if (!pts.length) pts = extractPoints('wpt');

        return { points: pts, xml };
      } catch (err) {
        console.error('GPX parse error', err);
        return { points: [], xml: null };
      }
    }

    function buildGpxGeoJson(xmlDoc) {
      if (!xmlDoc) return null;

      const lineFeatures = [];

      const extractCoords = (nodeList) => {
        return Array.from(nodeList)
          .map((el) => {
            const lat = parseFloat(el.getAttribute('lat'));
            const lon = parseFloat(el.getAttribute('lon'));
            if (Number.isFinite(lat) && Number.isFinite(lon)) {
              return [lon, lat];
            }
            return null;
          })
          .filter(Boolean);
      };

      const trackSegments = getElementsByLocalName(xmlDoc, 'trkseg');
      trackSegments.forEach((seg) => {
        const coords = extractCoords(getElementsByLocalName(seg, 'trkpt'));
        if (coords.length >= 2) {
          lineFeatures.push({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: coords },
            properties: {}
          });
        }
      });

      if (!lineFeatures.length) {
        const rteCoords = extractCoords(getElementsByLocalName(xmlDoc, 'rtept'));
        if (rteCoords.length >= 2) {
          lineFeatures.push({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: rteCoords },
            properties: {}
          });
        }
      }

      if (!lineFeatures.length) return { type: 'FeatureCollection', features: [] };

      return {
        type: 'FeatureCollection',
        features: lineFeatures
      };
    }

    function clearGpxTrack() {
      if (gpxTrackLayer) {
        map.removeLayer(gpxTrackLayer);
        gpxTrackLayer = null;
      }
    }

    function renderGpxTrack(geoJson) {
      clearGpxTrack();
      if (!geoJson || !Array.isArray(geoJson.features) || !geoJson.features.length) return;
      gpxTrackLayer = L.geoJSON(geoJson, {
        style: {
          color: '#ff0000',

          opacity: 0.9
        }

      if (gpxTrackLayer.bringToBack) {

    }

    function fitMapToGpxTrack({ padding = 28, maxZoom = 16 } = {}) {
      if (!map || !gpxTrackLayer) return;
      const bounds = gpxTrackLayer.getBounds?.();
      if (!bounds || !bounds.isValid || !bounds.isValid()) return;
      map.fitBounds(bounds, { padding: [padding, padding], maxZoom, animate: true });
    }

    function downsamplePoints(points, maxPoints = 2000) {
      if (!Array.isArray(points) || !points.length) return [];
      const step = Math.max(1, Math.ceil(points.length / maxPoints));
      const sampled = points.filter((_, idx) => idx % step === 0);
      const last = points[points.length - 1];
      if (sampled[sampled.length - 1] !== last) {
        sampled.push(last);
      }
      return sampled;
    }

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function computeExpandedBBox(points, radiusMeters) {
      if (!points.length) return null;
      let minLat = points[0].lat, maxLat = points[0].lat, minLon = points[0].lon, maxLon = points[0].lon;
      points.forEach(({ lat, lon }) => {
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
      });
      const latBuffer = radiusMeters / 111320;
      const avgLatRad = ((minLat + maxLat) / 2) * (Math.PI / 180);
      const lonBuffer = radiusMeters / (111320 * Math.max(Math.cos(avgLatRad), 0.0001));
      return {
        minLat: minLat - latBuffer,
        maxLat: maxLat + latBuffer,
        minLon: minLon - lonBuffer,
        maxLon: maxLon + lonBuffer
      };
    }

    function isPointInBBox(lat, lon, bbox) {
      if (!bbox) return true;
      return !(lat < bbox.minLat || lat > bbox.maxLat || lon < bbox.minLon || lon > bbox.maxLon);
    }

    function isFeatureNearGpx(feature) {
      if (!gpxState.active || !gpxState.sampledPoints.length) return true;
      if (!feature || !feature.geometry || feature.geometry.type !== 'Point') return false;
      const coords = feature.geometry.coordinates || [];
      const lon = Number(coords[0]);
      const lat = Number(coords[1]);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return false;
      if (!isPointInBBox(lat, lon, gpxState.bbox)) return false;

      const radius = gpxState.radiusMeters;
      let minDist = Infinity;
      for (let i = 0; i < gpxState.sampledPoints.length; i++) {
        const pt = gpxState.sampledPoints[i];
        const dist = haversineMeters(lat, lon, pt.lat, pt.lon);
        if (dist < minDist) minDist = dist;
        if (minDist <= radius) break;
      }
      return minDist <= radius;
    }

    function filteredFeatures(entry) {
      if (!entry || !Array.isArray(entry.originalFeatures)) return [];
      if (!gpxState.active) return entry.originalFeatures;
      if (!gpxState.sampledPoints || !gpxState.sampledPoints.length) return [];
      return entry.originalFeatures.filter((f) => isFeatureNearGpx(f));
    }

    function measureDrawerWidth() {

    function popupHtml(props, categoryId, lat, lng) {

    function pruneMarkerCache() {
      if (markerCache.size <= MARKER_CACHE_LIMIT) return;
      const entries = Array.from(markerCache.entries()).sort((a, b) => a[1].lastUsed - b[1].lastUsed);
      const excess = markerCache.size - MARKER_CACHE_LIMIT;
      for (let i = 0; i < excess; i++) {
        markerCache.delete(entries[i][0]);
      }
    }

    function markerFromPoint(point) {
      if (!point) return null;
      const { id, lat, lng, categoryId, propsRef } = point;
      if (id == null) return null;
      const cached = markerCache.get(id);
      if (cached) {
        cached.lastUsed = renderCounter;
        cached.marker.setLatLng([lat, lng]);
        cached.marker.setIcon(iconForPoint(categoryId, propsRef));
        cached.marker.setPopupContent(popupHtml(propsRef, categoryId, lat, lng));
        return cached.marker;
      }
      const marker = L.marker([lat, lng], { icon: iconForPoint(categoryId, propsRef) });
      marker.bindPopup(popupHtml(propsRef, categoryId, lat, lng));
      markerCache.set(id, { marker, lastUsed: renderCounter });
      return marker;
    }

    function gridKey(lng, lat) {
      const x = Math.floor(lng / GRID_CELL_SIZE);
      const y = Math.floor(lat / GRID_CELL_SIZE);
      return `${x}:${y}`;
    }

    function rebuildGridIndex(points) {
      const index = new Map();
      points.forEach((pt, idx) => {
        const key = gridKey(pt.lng, pt.lat);
        if (!index.has(key)) index.set(key, []);
        index.get(key).push(idx);
      });
      gridIndex = index;
    }

    function collectIndicesInSegment(south, north, west, east) {
      const minX = Math.floor(west / GRID_CELL_SIZE);
      const maxX = Math.floor(east / GRID_CELL_SIZE);
      const minY = Math.floor(south / GRID_CELL_SIZE);
      const maxY = Math.floor(north / GRID_CELL_SIZE);
      const indices = [];
      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          const pts = gridIndex.get(`${x}:${y}`);
          if (!pts) continue;
          for (const idx of pts) {
            const pt = activePoints[idx];
            if (!pt) continue;
            if (pt.lat >= south && pt.lat <= north && pt.lng >= west && pt.lng <= east) {
              indices.push(idx);
            }
          }
        }
      }
      return indices;
    }

    function countPointsInSegment(south, north, west, east) {
      return collectIndicesInSegment(south, north, west, east).length;
    }

    function countVisibleInBounds(bounds) {
      if (!bounds) return 0;
      const south = bounds.getSouth();
      const north = bounds.getNorth();
      const west = bounds.getWest();
      const east = bounds.getEast();

      if (west <= east) {
        return countPointsInSegment(south, north, west, east);
      }

      // Handle world-wrap by splitting into two segments
      return (
        countPointsInSegment(south, north, west, 180) +
        countPointsInSegment(south, north, -180, east)
      );
    }

    function getPaddedBounds(bounds, paddingPx = 0) {
      if (!map || !bounds || !paddingPx) return bounds;
      const size = map.getSize();
      const topLeft = map.containerPointToLatLng(L.point(-paddingPx, -paddingPx));
      const bottomRight = map.containerPointToLatLng(L.point(size.x + paddingPx, size.y + paddingPx));
      return L.latLngBounds(topLeft, bottomRight);
    }

    function getVisiblePointIndices(bounds, paddingPx = 0) {
      const padded = paddingPx ? getPaddedBounds(bounds, paddingPx) : bounds;
      if (!padded) return [];
      const south = padded.getSouth();
      const north = padded.getNorth();
      const west = padded.getWest();
      const east = padded.getEast();

      if (west <= east) {
        return collectIndicesInSegment(south, north, west, east);
      }

      const left = collectIndicesInSegment(south, north, west, 180);
      const right = collectIndicesInSegment(south, north, -180, east);
      return left.concat(right);
    }

    function getVisiblePoints(bounds, paddingPx = 0) {
      return getVisiblePointIndices(bounds, paddingPx)
        .map((idx) => activePoints[idx])
        .filter(Boolean);
    }

    function renderWithMode(mode, forceRender = false) {
      const normalizedMode = mode === 'cluster' ? 'cluster' : 'plain';
      if (!map) return;

      const bounds = map.getBounds();
      const paddingPx = normalizedMode === 'cluster' ? 300 : 0;
      renderCounter++;

      const visiblePoints = getVisiblePoints(bounds, paddingPx);

      poiCluster.clearLayers();
      poiPlain.clearLayers();

      if (!visiblePoints.length) {
        if (map.hasLayer(poiPlain)) map.removeLayer(poiPlain);
        if (map.hasLayer(poiCluster)) map.removeLayer(poiCluster);
        currentMode = normalizedMode;
        pruneMarkerCache();
        return;
      }

      if (normalizedMode === 'cluster') {
        const markers = visiblePoints.map((pt) => markerFromPoint(pt)).filter(Boolean);
        poiCluster.addLayers(markers);
        if (!map.hasLayer(poiCluster)) map.addLayer(poiCluster);
        if (map.hasLayer(poiPlain)) map.removeLayer(poiPlain);
      } else {
        visiblePoints.forEach((pt) => {
          const marker = markerFromPoint(pt);
          if (marker) poiPlain.addLayer(marker);
        });
        if (!map.hasLayer(poiPlain)) map.addLayer(poiPlain);
        if (map.hasLayer(poiCluster)) map.removeLayer(poiCluster);
      }

      pruneMarkerCache();
      currentMode = normalizedMode;
    }

    function renderPois(pointsArray) {
      activePoints = Array.isArray(pointsArray) ? pointsArray : [];
      rebuildGridIndex(activePoints);
      updateClusteringForViewport(true);
    }

    function updateClusteringForViewport(forceRender = false) {
      if (!map) return;
      const bounds = map.getBounds();
      const visibleCount = countVisibleInBounds(bounds);
      const nextMode = visibleCount > viewportClusterThreshold ? 'cluster' : 'plain';
      renderWithMode(nextMode, forceRender);
    }

    const debouncedViewportUpdate = debounce(() => updateClusteringForViewport(false), CLUSTER_DEBOUNCE_MS);
    map.on('moveend', debouncedViewportUpdate);
    map.on('zoomend', debouncedViewportUpdate);

    async function loadGeoJSON(url) {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error(`Fetch failed for ${url}: HTTP ${r.status}`);
      const txt = await r.text();
      return JSON.parse(txt);
    }

    async function loadManifest() {
      const r = await fetch(MANIFEST_URL, { cache: 'no-store' });
      if (!r.ok) throw new Error(`Manifest could not be loaded (HTTP ${r.status})`);
      const data = await r.json();
      const bundeslaender = Array.isArray(data.bundeslaender) ? data.bundeslaender : [];
      const categories = Array.isArray(data.categories) ? data.categories : [];
      return { bundeslaender, categories };
    }

    async function ensureDataset(bundeslandId, categoryId) {
      const key = comboKey(bundeslandId, categoryId);
      if (datasetCache.has(key)) return datasetCache.get(key);
      if (missingCache.has(key)) return null;

      const url = `resources/geojson/${bundeslandId}/${categoryId}.geojson`;

      try {
        const geojson = await loadGeoJSON(url);
        const features = Array.isArray(geojson.features) ? geojson.features : [];
        const normalized = [];
        features.forEach((f) => {
          if (!f || !f.geometry || f.geometry.type !== 'Point') return;
          const coords = f.geometry.coordinates || [];
          const lon = Number(coords[0]);
          const lat = Number(coords[1]);
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
          f.properties = f.properties || {};
          f.properties.bundeslandId = bundeslandId;
          f.properties.categoryId = categoryId;
          f.properties.categoryLabel = categoryLabelMap[categoryId];
          normalized.push(f);
        });
        const entry = { status: 'ready', originalFeatures: normalized };
        datasetCache.set(key, entry);
        return entry;
      } catch (err) {
        if (!missingCache.has(key)) {
          console.warn(`GeoJSON missing for ${bundeslandId}/${categoryId}:`, err);
          missingCache.add(key);
        }
        return null;
      }
    }

    async function applyFilters() {
      const runId = ++filterRunId;
      const combos = [];
      filterState.bundeslaender.forEach((bundeslandId) => {
        filterState.kategorien.forEach((categoryId) => {
          combos.push({ key: comboKey(bundeslandId, categoryId), bundeslandId, categoryId });
        });
      });

      if (!combos.length) {
        renderPois([]);
        return;
      }

      await Promise.all(combos.map(({ bundeslandId, categoryId }) => ensureDataset(bundeslandId, categoryId)));

      const points = [];
      combos.forEach(({ key }) => {
        const entry = datasetCache.get(key);
        if (!entry || entry.status !== 'ready') return;
        const entryKey = key;
        const feats = filteredFeatures(entry);
        feats.forEach((f) => {
          const coords = f.geometry?.coordinates || [];
          const lon = Number(coords[0]);
          const lat = Number(coords[1]);
          if (Number.isFinite(lat) && Number.isFinite(lon)) {
            const poiId = stablePoiId(f, entryKey);
            if (!poiId) return;
            points.push({ id: poiId, lat, lng: lon, categoryId: f.properties?.categoryId, propsRef: f.properties });
          }
        });
      });

      if (runId !== filterRunId) return; // stale run, abort rendering

      renderPois(points);
    }

    function resetGpxState() {
      gpxState.active = false;
      gpxState.points = [];
      gpxState.sampledPoints = [];
      gpxState.radiusMeters = DEFAULT_GPX_RADIUS_KM * 1000;
      gpxState.bbox = null;
      gpxState.geoJson = null;
      const fileInput = document.getElementById('gpxFileInput');
      const radiusInput = document.getElementById('gpxRadiusKm');
      const err = document.getElementById('gpxError');
      clearGpxTrack();
      if (fileInput) fileInput.value = '';
      if (radiusInput) radiusInput.value = DEFAULT_GPX_RADIUS_KM.toFixed(1);
      if (err) err.textContent = '';
    }

    async function handleGpxApply() {
      const errorEl = document.getElementById('gpxError');
      const radiusInput = document.getElementById('gpxRadiusKm');
      const fileInput = document.getElementById('gpxFileInput');
      if (errorEl) errorEl.textContent = '';

      const clampedKm = clampRadiusKm(radiusInput ? radiusInput.value : DEFAULT_GPX_RADIUS_KM);
      if (radiusInput) radiusInput.value = clampedKm.toFixed(1);
      const radiusMeters = clampedKm * 1000;

      let trackPoints = gpxState.points;
      let gpxGeoJson = gpxState.geoJson;
      const file = fileInput?.files?.[0];
      const hasNewFile = Boolean(file);
      if (file) {
        try {
          const text = await readFileAsText(file);
          const parsed = parseGpxText(text);
          trackPoints = parsed.points;
          gpxGeoJson = buildGpxGeoJson(parsed.xml);
        } catch (err) {
          if (errorEl) errorEl.textContent = 'Could not read the file.';
          return;
        }
      } else if (!trackPoints || !trackPoints.length) {
        if (errorEl) errorEl.textContent = 'Please select a valid GPX file.';
        return;
      }

      if (!trackPoints || !trackPoints.length) {
        if (errorEl) errorEl.textContent = 'Please select a valid GPX file.';
        return;
      }

      const sampled = downsamplePoints(trackPoints);
      if (!sampled.length) {
        if (errorEl) errorEl.textContent = 'No points found in the GPX file.';
        return;
      }

      gpxState.points = trackPoints;
      gpxState.sampledPoints = sampled;
      gpxState.radiusMeters = radiusMeters;
      gpxState.bbox = computeExpandedBBox(sampled, radiusMeters);
      gpxState.geoJson = gpxGeoJson;
      gpxState.active = true;

      console.log('GPX points:', trackPoints.length, 'sampled:', sampled.length, 'radiusMeters:', radiusMeters);

      renderGpxTrack(gpxGeoJson);
      if (hasNewFile) {
        fitMapToGpxTrack({ padding: 28, maxZoom: 16 });
      }

      await applyFilters();
    }

    function resetAllFilters() {
      filterState.bundeslaender = new Set((manifestData.bundeslaender || []).map((b) => b.id));
      filterState.kategorien = new Set((manifestData.categories || []).map((c) => c.id));
      renderChecklist('blList', manifestData.bundeslaender, filterState.bundeslaender, 'bl');
      renderChecklist('catList', manifestData.categories, filterState.kategorien, 'cat');
      resetGpxState();
      viewportClusterThreshold = DEFAULT_CLUSTER_THRESHOLD;
      const clusterInput = document.getElementById('clusterThresholdInput');
      if (clusterInput) clusterInput.value = String(viewportClusterThreshold);
      localStorage.removeItem(CLUSTER_THRESHOLD_KEY);
      updateClusteringForViewport(true);
      triggerApplyFilters();
    }

    // User position marker + accuracy circle
    let userMarker = null;
    let userAccuracy = null;
    let watchId = null;

    function goToUserLocation({ centerOnFix = true, suppressErrorAlert = false } = {}) {
      if (!navigator.geolocation) {
        if (!suppressErrorAlert) {
          alert("Geolocation is not supported by this browser.");
        }
        return;
      }

      let shouldCenter = centerOnFix;

      // Reuse watch if active; otherwise start it
      if (watchId == null) {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude, longitude, accuracy } = pos.coords;
            const ll = [latitude, longitude];

            if (!userMarker) {
              userMarker = L.circleMarker(ll, { radius: 8, weight: 2, opacity: 0.95, fillOpacity: 0.8 }).addTo(map);
              userMarker.bindPopup("Your location");
            } else {
              userMarker.setLatLng(ll);
            }

            if (!userAccuracy) {
              userAccuracy = L.circle(ll, { radius: accuracy, weight: 1, opacity: 0.35, fillOpacity: 0.08 }).addTo(map);
            } else {
              userAccuracy.setLatLng(ll);
              userAccuracy.setRadius(accuracy);
            }

            if (shouldCenter) {
              map.setView(ll, Math.max(map.getZoom(), 15), { animate: true });
              shouldCenter = false;
            }
          },
          (err) => {
            if (!suppressErrorAlert) {
              alert("Could not determine location: " + err.message);
            }
          },
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
        );
      } else if (shouldCenter && userMarker) {
        map.setView(userMarker.getLatLng(), Math.max(map.getZoom(), 15), { animate: true });
      }
    }

    (async () => {
      manifestData = await loadManifest();
      categoryLabelMap = (manifestData.categories || []).reduce((acc, cat) => {
        acc[cat.id] = cat.label;
        return acc;
      }, {});

      manifestData.bundeslaender.forEach(bl => filterState.bundeslaender.add(bl.id));
      manifestData.categories.forEach(cat => filterState.kategorien.add(cat.id));

      renderChecklist('blList', manifestData.bundeslaender, filterState.bundeslaender, 'bl');
      renderChecklist('catList', manifestData.categories, filterState.kategorien, 'cat');
      setAccordionHandlers();
      setupDrawer();
      setupDrawerWidthMeasurement();
      setupThemeToggle();
      setupClusterThresholdControl();

      await applyFilters();

      document.getElementById('locateButton').addEventListener('click', () => goToUserLocation({ centerOnFix: true }));

      document.getElementById('blSelectAll').addEventListener('click', () => selectAll(manifestData.bundeslaender, filterState.bundeslaender, 'blList', 'bl'));
      document.getElementById('blSelectNone').addEventListener('click', () => selectNone(filterState.bundeslaender, 'blList', 'bl', manifestData.bundeslaender));
      document.getElementById('catSelectAll').addEventListener('click', () => selectAll(manifestData.categories, filterState.kategorien, 'catList', 'cat'));
      document.getElementById('catSelectNone').addEventListener('click', () => selectNone(filterState.kategorien, 'catList', 'cat', manifestData.categories));

      const radiusInput = document.getElementById('gpxRadiusKm');
      if (radiusInput) {
        radiusInput.addEventListener('change', () => {
          radiusInput.value = formatRadiusKm(radiusInput.value);
        });
        radiusInput.addEventListener('blur', () => {
          radiusInput.value = formatRadiusKm(radiusInput.value);
        });
      }
      const gpxApplyBtn = document.getElementById('gpxApplyBtn');
      if (gpxApplyBtn) {
        gpxApplyBtn.addEventListener('click', () => { handleGpxApply().catch(err => console.error(err)); });
      }
      const resetBtn = document.getElementById('resetAllBtn');
      if (resetBtn) {
        resetBtn.addEventListener('click', resetAllFilters);
      }

      goToUserLocation({ centerOnFix: true, suppressErrorAlert: true });
    })().catch(err => {
      console.error(err);
      alert("Loading error: " + (err.message || err));
      map.setView(FALLBACK_VIEW.center, FALLBACK_VIEW.zoom);
    });
  </script>
